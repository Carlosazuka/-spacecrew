/* =====================================================
   COLLISION
===================================================== */

function circleRectCollision(
  cx,
  cy,
  r,
  rect
){

  const nearestX =
    Math.max(
      rect.x,
      Math.min(
        cx,
        rect.x+rect.w
      )
    );

  const nearestY =
    Math.max(
      rect.y,
      Math.min(
        cy,
        rect.y+rect.h
      )
    );

  const dx =
    cx-nearestX;

  const dy =
    cy-nearestY;

  return (
    dx*dx+
    dy*dy
  ) < r*r;
}


function canMove(
  x,
  y
){

  const radius=24;

  if(
    x<90 ||
    y<90 ||
    x>2310 ||
    y>1410
  ){

    return false;
  }


  for(
    const wall of walls
  ){

    if(
      circleRectCollision(
        x,
        y,
        radius,
        wall
      )
    ){

      let nearDoor=false;

      for(
        const d of doors
      ){

        const expanded={
          x:d.x-20,
          y:d.y-20,
          w:d.w+40,
          h:d.h+40
        };

        if(
          circleRectCollision(
            x,
            y,
            radius,
            expanded
          )
        ){

          nearDoor=true;

          break;
        }

      }

      if(!nearDoor)
        return false;

    }

  }

  return true;
}


/* =====================================================

const joystick =
document.getElementById(
  "joystick"
);

  "stick"

let joyX=0;
let joyY=0;
let pointer=null;


function updateJoystick(
  x,
  y
){

  const rect =
    joystick.getBoundingClientRect();

  const cx =
    rect.left+
    rect.width/2;

  const cy =
    rect.top+
    rect.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=38;

  const len=
    Math.hypot(
      dx,
      dy
    );

  if(len>max){

    dx=
      dx/len*max;

    dy=
      dy/len*max;

  }

  joyX=
    dx/max;

  joyY=
    dy/max;

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;

}


function stopJoystick(){

  pointer=null;

  joyX=0;
  joyY=0;

  stick.style.transform=
    "translate(0,0)";
}


joystick.addEventListener(
  "pointerdown",
  e=>{

    pointer=e.pointerId;

    joystick.setPointerCapture(
      pointer
    );

    updateJoystick(
      e.clientX,
      e.clientY
    );

  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(
      pointer!==e.pointerId
    )
      return;

    updateJoystick(
      e.clientX,
      e.clientY
    );

  }
);


joystick.addEventListener(
  "pointerup",

);

/* =====================================================
   DRAW PLAYER
===================================================== */

function drawPlayer(
  p,
  isMe=false
){

  const bob =
    p.moving
      ? Math.sin(p.walk)*2
      : 0;


  ctx.save();

  ctx.translate(
    p.x,
    p.y+bob
  );


  /* shadow */

  ctx.fillStyle="#00000055";

  ctx.beginPath();

  ctx.ellipse(
    0,
    24,
    24,
    10,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* legs */

  const step =
    p.moving
      ? Math.sin(p.walk)*6
      : 0;


  ctx.fillStyle =
    shadeColor(
      p.color,
      -25
    );


  ctx.fillRoundRect(
    -17+step,
    13,
    13,
    22,
    6
  );


  ctx.fillRoundRect(
    4-step,
    13,
    13,
    22,
    6
  );


  /* backpack */

  ctx.fillStyle =
    shadeColor(
      p.color,
      -40
    );

  ctx.fillRoundRect(
    -29,
    -18,
    15,
    38,
    6
  );


  /* body */

  ctx.fillStyle=p.color;

  ctx.beginPath();

  ctx.roundRect(
    -25,
    -30,
    50,
    58,
    18
  );

  ctx.fill();


  /* visor */

  ctx.fillStyle="#9be9ff";

  ctx.beginPath();

  ctx.ellipse(
    7,
    -10,
    21,
    14,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#d8f8ff";

  ctx.beginPath();

  ctx.ellipse(
    12,
    -14,
    10,
    5,
    -.2,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* name */

  if(!isMe){

    ctx.font=
      "bold 13px Arial";

    ctx.textAlign=
      "center";

    ctx.fillStyle="#ffffffdd";

    ctx.fillText(
      p.name || "Crewmate",
      0,
      -48
    );

  }


  ctx.restore();

}


/* =====================================================
   COLOR HELPERS
===================================================== */

function shadeColor(
  color,
  amount
){

  let c=
    color.replace(
      "#",
      ""
    );

  let num=
    parseInt(
      c,
      16
    );

  let r=
    (num>>16)+amount;

  let g=
    ((num>>8)&255)+amount;

  let b=
    (num&255)+amount;

  r=Math.max(
    0,
    Math.min(255,r)
  );

  g=Math.max(
    0,
    Math.min(255,g)
  );

  b=Math.max(
    0,
    Math.min(255,b)
  );

  return "#"+
    ((r<<16)|
     (g<<8)|
     b)
    .toString(16)
    .padStart(6,"0");

}

/* =====================================================
   LOAD PLAYERS
===================================================== */

async function loadPlayers(){

  if(!roomId)
    return;


  const result =
    await supabase
    .from("players")
    .select("*")
    .eq(
      "room_id",
      roomId
    );


  if(result.error){

    console.error(
      result.error
    );

    return;
  }


  (result.data || [])
  .forEach(
    p=>{

      if(p.id===myPlayerId){

        me.name=
          p.name || "You";

        if(
          p.x!==null &&
          p.x!==undefined
        )
          me.x=p.x;

        if(
          p.y!==null &&
          p.y!==undefined
        )
          me.y=p.y;

        return;

      }


      players.set(
        p.id,
        {

          id:p.id,

          name:
            p.name || "Crewmate",

          x:
            p.x ?? 1200,

          y:
            p.y ?? 750,

          color:
            COLORS[
              Math.abs(
                hashCode(p.id)
              )%COLORS.length
            ],

          moving:false,

          direction:1,

          walk:0

        }
      );

    }
  );

}


function hashCode(str){

  let h=0;

  for(
    let i=0;
    i<str.length;
    i++
  ){

    h=
      ((h<<5)-h)+
      str.charCodeAt(i);

    h|=0;

  }

  return h;

}


/* =====================================================
   REALTIME
===================================================== */

let channel=null;


function connectRealtime(){

  if(!roomId)
    return;


  channel =
    supabase
    .channel(
      "game-"+roomId
    )

    .on(
      "postgres_changes",

      {
        event:"*",
        schema:"public",
        table:"players",
        filter:
          "room_id=eq."+roomId
      },

      payload=>{

        const p =
          payload.new;


        if(
          payload.eventType==="DELETE"
        ){

          players.delete(
            payload.old.id
          );

          return;
        }


        if(!p || p.id===myPlayerId)
          return;


        let existing=
          players.get(p.id);


        if(!existing){

          existing={

            id:p.id,

            name:p.name ||
              "Crewmate",

            x:p.x ?? 1200,

            y:p.y ?? 750,

            color:
              COLORS[
                Math.abs(
                  hashCode(p.id)
                )%COLORS.length
              ],

            moving:false,

            direction:1,

            walk:0

          };

          players.set(
            p.id,
            existing
          );

        }


        const oldX=existing.x;
        const oldY=existing.y;


        existing.x=
          p.x ?? existing.x;

        existing.y=
          p.y ?? existing.y;

        existing.name=
          p.name || existing.name;


        if(
          Math.abs(
            existing.x-oldX
          )>.5 ||
          Math.abs(
            existing.y-oldY
          )>.5
        ){

          existing.moving=true;

          existing.walk+=.8;

        }else{

          existing.moving=false;

        }

      }
    )

    .subscribe();

}


/* =====================================================
   MOVEMENT
===================================================== */

const SPEED=3.6;


function updateMovement(){

  let x=joyX;
  let y=joyY;


  if(keys["w"] || keys["arrowup"])
    y=-1;

  if(keys["s"] || keys["arrowdown"])
    y=1;

  if(keys["a"] || keys["arrowleft"])
    x=-1;

  if(keys["d"] || keys["arrowright"])
    x=1;


  const len=
    Math.hypot(
      x,
      y
    );


  if(len>1){

    x/=len;
    y/=len;

  }


  me.moving=
    Math.abs(x)>.05 ||
    Math.abs(y)>.05;


  if(me.moving){

    me.walk+=.25;


    if(Math.abs(x)>.05){

      me.direction=
        x>0
          ? 1
          : -1;

    }


    const nx=
      me.x+x*SPEED;

    const ny=
      me.y+y*SPEED;


    if(
      canMove(
        nx,
        me.y
      )
    ){

      me.x=nx;

    }


    if(
      canMove(
        me.x,
        ny
      )
    ){

      me.y=ny;

    }


    sendPosition();

  }

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  updateCamera();


  /*
    Zoom is fixed.
    No pinch zoom.
    No browser zoom.
  */

  const ZOOM=
    Math.min(
      W/850,
      H/520
    );

  const scale=
    Math.max(
      .62,
      Math.min(
        1,
        ZOOM
      )
    );


  ctx.save();


  ctx.translate(
    W/2,
    H/2
  );


  ctx.scale(
    scale,
    scale
  );


  ctx.translate(
    -camera.x,
    -camera.y
  );


  drawFloor();


  decorations.forEach(
    drawDecoration
  );


  /*
    other players
  */

  players.forEach(
    p=>{
      drawPlayer(
        p,
        false
      );
    }
  );


  /*
    local player
  */

  drawPlayer(
    me,
    true
  );


  ctx.restore();

}


/* =====================================================
   GAME LOOP
===================================================== */

function loop(){

  updateMovement();

  draw();

  requestAnimationFrame(
    loop
  );

}


loop();


/* =====================================================
   STARTUP
===================================================== */

async function startup(){

  if(!roomId){

    me.name="Player";

    return;

  }


  await loadPlayers();

  connectRealtime();

}


startup();

    e.preventDefault();
  },
  {

  }

/* =====================================================
   CANVAS ROUND RECT POLYFILL
===================================================== */

if(!CanvasRenderingContext2D.prototype.fillRoundRect){

  CanvasRenderingContext2D.prototype.fillRoundRect=
  function(
    x,
    y,
    w,
    h,
    r
  ){

    r=Math.min(
      r,
      w/2,
      h/2
    );

    this.beginPath();

    this.moveTo(
      x+r,
      y
    );

    this.arcTo(
      x+w,
      y,
      x+w,
      y+h,
      r
    );

    this.arcTo(
      x+w,
      y+h,
      x,
      y+h,
      r
    );

    this.arcTo(
      x,
      y+h,
      x,
      y,
      r
    );

    this.arcTo(
      x,
      y,
      x+w,
      y,
      r
    );

    this.closePath();

    this.fill();

  };

}
