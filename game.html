<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,orientation:landscape">

<title>SpaceCrew</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080b15;
  touch-action:none;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hud{
  position:fixed;
  top:12px;
  left:12px;
  z-index:5;
  padding:9px 13px;
  border-radius:12px;
  background:#070a13cc;
  border:1px solid #ffffff22;
  color:white;
  font-weight:800;
  pointer-events:none;
}

#joystick{
  position:fixed;
  left:22px;
  bottom:20px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:#ffffff12;
  border:2px solid #ffffff30;
  z-index:10;
}

#stick{
  position:absolute;
  left:34px;
  top:34px;
  width:55px;
  height:55px;
  border-radius:50%;
  background:#ffffff40;
  border:2px solid #ffffff70;
}

#rotate{
  position:fixed;
  right:20px;
  bottom:25px;
  color:#ffffff88;
  font-size:12px;
}
</style>
</head>

<body>

<div id="hud">SPACECREW • <span id="name">CREWMATE</span></div>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="rotate">
  LANDSCAPE MODE
</div>

<canvas id="game"></canvas>

<script>

/* =====================================
   CANVAS
===================================== */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

let W=0;
let H=0;

function resize(){

  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;

}

resize();

addEventListener("resize",resize);


/* =====================================
   PLAYER
===================================== */

const player={
  x:0,
  y:0,
  speed:2.7,
  color:"#5865f2",
  name:"CREWMATE"
};


/* =====================================
   MAP
===================================== */

const MAP_W=2600;
const MAP_H=1500;


/*
  საკუთარი SpaceCrew რუკა:
  ცენტრალური ოთახი
  მარცხენა ოთახები
  მარჯვენა ოთახები
  ზედა/ქვედა ოთახები
*/

const rooms=[
  {x:900,y:480,w:800,h:540},
  {x:150,y:250,w:520,h:400},
  {x:1930,y:230,w:500,h:420},
  {x:150,y:900,w:520,h:400},
  {x:1940,y:900,w:500,h:400},
  {x:950,y:80,w:700,h:250},
  {x:950,y:1170,w:700,h:250}
];


/* =====================================
   WALLS
===================================== */

const walls=[];

function addWall(x,y,w,h){
  walls.push({x,y,w,h});
}


/*
 CENTRAL
*/

addWall(900,480,800,25);
addWall(900,995,800,25);

addWall(900,480,25,180);
addWall(900,850,25,170);

addWall(1675,480,25,180);
addWall(1675,850,25,170);


/*
 LEFT TOP
*/

addWall(150,250,520,25);
addWall(150,625,520,25);
addWall(150,250,25,375);
addWall(645,250,25,130);
addWall(645,500,25,125);


/*
 LEFT BOTTOM
*/

addWall(150,900,520,25);
addWall(150,1275,520,25);
addWall(150,900,25,375);
addWall(645,900,25,130);
addWall(645,1150,25,125);


/*
 RIGHT TOP
*/

addWall(1930,230,500,25);
addWall(1930,625,500,25);
addWall(1930,230,25,395);
addWall(2405,230,25,395);


/*
 RIGHT BOTTOM
*/

addWall(1940,900,500,25);
addWall(1940,1275,500,25);
addWall(1940,900,25,375);
addWall(2415,900,25,375);


/*
 TOP
*/

addWall(950,80,700,25);
addWall(950,305,700,25);
addWall(950,80,25,90);
addWall(950,215,25,90);

addWall(1625,80,25,90);
addWall(1625,215,25,90);


/*
 BOTTOM
*/

addWall(950,1170,700,25);
addWall(950,1420,700,25);
addWall(950,1170,25,80);
addWall(950,1340,25,80);

addWall(1625,1170,25,80);
addWall(1625,1340,25,80);


/* =====================================
   START
===================================== */

player.x=1300;
player.y=750;


/* =====================================
   JOYSTICK
===================================== */

const joystick=
document.getElementById("joystick");

const stick=
document.getElementById("stick");

let moveX=0;
let moveY=0;
let active=false;

function joystickMove(x,y){

  const r=
  joystick.getBoundingClientRect();

  const cx=
  r.left+r.width/2;

  const cy=
  r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=38;

  const d=
  Math.sqrt(dx*dx+dy*dy);

  if(d>max){

    dx=dx/d*max;
    dy=dy/d*max;

  }

  stick.style.transform=
  `translate(${dx}px,${dy}px)`;

  moveX=dx/max;
  moveY=dy/max;

}


joystick.addEventListener(
"pointerdown",
e=>{

  active=true;

  joystick.setPointerCapture(
    e.pointerId
  );

  joystickMove(
    e.clientX,
    e.clientY
  );

});


joystick.addEventListener(
"pointermove",
e=>{

  if(active)
    joystickMove(
      e.clientX,
      e.clientY
    );

});


function stop(){

  active=false;

  moveX=0;
  moveY=0;

  stick.style.transform=
  "translate(0,0)";

}


joystick.addEventListener(
"pointerup",stop);

joystick.addEventListener(
"pointercancel",stop);


/* =====================================
   KEYBOARD
===================================== */

const keys={};

addEventListener(
"keydown",
e=>{
  keys[e.key.toLowerCase()]=true;
});

addEventListener(
"keyup",
e=>{
  keys[e.key.toLowerCase()]=false;
});


/* =====================================
   COLLISION
===================================== */

function blocked(x,y){

  const r=22;

  for(const wall of walls){

    if(
      x+r>wall.x &&
      x-r<wall.x+wall.w &&
      y+r>wall.y &&
      y-r<wall.y+wall.h
    ){

      return true;

    }

  }

  return false;

}


/* =====================================
   PLAYER DRAW
===================================== */

function drawPlayer(){

  const x=
    player.x-camera.x;

  const y=
    player.y-camera.y;


  /*
    shadow
  */

  ctx.fillStyle=
    "rgba(0,0,0,.35)";

  ctx.beginPath();

  ctx.ellipse(
    x,
    y+22,
    25,
    10,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    body
  */

  ctx.fillStyle=
    player.color;

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    24,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    backpack
  */

  ctx.fillStyle=
    "#414967";

  ctx.roundRect(
    x-28,
    y-8,
    10,
    23,
    5,
    5
  );

  ctx.fill();


  /*
    visor
  */

  ctx.fillStyle=
    "#9beaff";

  ctx.beginPath();

  ctx.ellipse(
    x+8,
    y-7,
    14,
    9,
    -.15,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    visor shine
  */

  ctx.fillStyle=
    "#e5fbff";

  ctx.beginPath();

  ctx.arc(
    x+12,
    y-10,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    name
  */

  ctx.fillStyle=
    "white";

  ctx.font=
    "bold 12px Arial";

  ctx.textAlign=
    "center";

  ctx.fillText(
    player.name,
    x,
    y-34
  );

}


/* =====================================
   MAP DRAW
===================================== */

function drawMap(){

  ctx.fillStyle=
    "#101626";

  ctx.fillRect(
    0,
    0,
    MAP_W,
    MAP_H
  );


  /*
    rooms
  */

  for(const room of rooms){

    ctx.fillStyle=
      "#202943";

    ctx.fillRect(
      room.x,
      room.y,
      room.w,
      room.h
    );


    ctx.strokeStyle=
      "#3b4668";

    ctx.lineWidth=5;

    ctx.strokeRect(
      room.x,
      room.y,
      room.w,
      room.h
    );

  }


  /*
    corridors
  */

  ctx.fillStyle=
    "#151d32";

  ctx.fillRect(
    650,
    620,
    1250,
    150
  );

  ctx.fillRect(
    1200,
    300,
    150,
    950
  );


  /*
    walls
  */

  for(const wall of walls){

    ctx.fillStyle=
      "#59627d";

    ctx.fillRect(
      wall.x,
      wall.y,
      wall.w,
      wall.h
    );

    ctx.strokeStyle=
      "#747e9d";

    ctx.lineWidth=3;

    ctx.strokeRect(
      wall.x,
      wall.y,
      wall.w,
      wall.h
    );

  }


  /*
    central table
  */

  ctx.fillStyle=
    "#343d5a";

  ctx.beginPath();

  ctx.ellipse(
    1300,
    750,
    105,
    65,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.strokeStyle=
    "#697493";

  ctx.lineWidth=4;

  ctx.stroke();


  /*
    small screen on table
  */

  ctx.fillStyle=
    "#78e7ff";

  ctx.fillRect(
    1270,
    725,
    60,
    18
  );


  /*
    room decorations
  */

  drawDecoration(
    300,400,
    "CAFETERIA"
  );

  drawDecoration(
    2070,380,
    "REACTOR"
  );

  drawDecoration(
    300,1050,
    "ENGINE"
  );

  drawDecoration(
    2080,1050,
    "LAB"
  );

}


function drawDecoration(x,y,text){

  ctx.fillStyle=
    "#2d3857";

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    35,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle=
    "#8d98bb";

  ctx.font=
    "bold 13px Arial";

  ctx.textAlign=
    "center";

  ctx.fillText(
    text,
    x,
    y+60
  );

}


/* =====================================
   CAMERA
===================================== */

const camera={
  x:0,
  y:0
};


/* =====================================
   GAME LOOP
===================================== */

function update(){

  let x=moveX;
  let y=moveY;


  if(keys["w"]||
     keys["arrowup"])
    y=-1;

  if(keys["s"]||
     keys["arrowdown"])
    y=1;

  if(keys["a"]||
     keys["arrowleft"])
    x=-1;

  if(keys["d"]||
     keys["arrowright"])
    x=1;


  const len=
    Math.sqrt(
      x*x+y*y
    );


  if(len>1){

    x/=len;
    y/=len;

  }


  const nx=
    player.x+x*player.speed;

  const ny=
    player.y+y*player.speed;


  if(!blocked(nx,player.y))
    player.x=nx;

  if(!blocked(player.x,ny))
    player.y=ny;


  player.x=
    Math.max(
      30,
      Math.min(
        MAP_W-30,
        player.x
      )
    );

  player.y=
    Math.max(
      30,
      Math.min(
        MAP_H-30,
        player.y
      )
    );


  /*
    camera follows player
  */

  camera.x=
    player.x-W/2;

  camera.y=
    player.y-H/2;


  camera.x=
    Math.max(
      0,
      Math.min(
        MAP_W-W,
        camera.x
      )
    );

  camera.y=
    Math.max(
      0,
      Math.min(
        MAP_H-H,
        camera.y
      )
    );

}


function render(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );


  ctx.save();

  ctx.translate(
    -camera.x,
    -camera.y
  );


  drawMap();

  drawPlayer();


  ctx.restore();


  /*
    dark vignette
  */

  const gradient=
    ctx.createRadialGradient(
      W/2,
      H/2,
      H*.15,
      W/2,
      H/2,
      H*.8
    );

  gradient.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,.28)"
  );

  ctx.fillStyle=
    gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

}


function loop(){

  update();

  render();

  requestAnimationFrame(loop);

}

loop();


/* =====================================
   PLAYER NAME FROM URL
===================================== */

const params=
new URLSearchParams(
  location.search
);

if(params.get("name")){

  player.name=
    params.get("name");

  document
    .getElementById("name")
    .textContent=
    player.name;

}

</script>

</body>
</html>
