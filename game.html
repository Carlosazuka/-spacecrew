/* =========================================================
   FIND FREE SPAWN
========================================================= */

function spawnPosition(index){

  const positions=[
    [460,530],
    [390,530],
    [530,530],
    [460,460],
    [390,460],
    [530,460],
    [460,600],
    [390,600],
    [530,600],
    [320,530],
    [600,530],
    [320,460],
    [600,460],
    [320,600],
    [600,600]
  ];

  return positions[index%positions.length];
}


/* =========================================================
   COLLISION
========================================================= */

function circleRectCollision(
  x,y,r,rect
){

  const cx =
    Math.max(
      rect.x,
      Math.min(x,rect.x+rect.w)
    );

  const cy =
    Math.max(
      rect.y,
      Math.min(y,rect.y+rect.h)
    );

  const dx=x-cx;
  const dy=y-cy;

  return dx*dx+dy*dy < r*r;
}


function blocked(x,y){

  const r=25;

  for(const w of walls){

    if(
      circleRectCollision(
        x,y,r,w
      )
    ){
      return true;
    }

  }

  return false;
}


/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
document.getElementById("joystick");

const stick =
document.getElementById("stick");

let joyX=0;
let joyY=0;
let active=false;

function updateJoystick(x,y){

  const rect =
    joystick.getBoundingClientRect();

  const cx =
    rect.left+rect.width/2;

  const cy =
    rect.top+rect.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=38;

  const len =
    Math.hypot(dx,dy);

  if(len>max){

    dx=dx/len*max;
    dy=dy/len*max;

  }

  stick.style.transform =
    `translate(${dx}px,${dy}px)`;

  joyX=dx/max;
  joyY=dy/max;
}


joystick.addEventListener(
  "pointerdown",
  e=>{

    active=true;

    joystick.setPointerCapture(
      e.pointerId
    );

    updateJoystick(
      e.clientX,
      e.clientY
    );

  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(!active)return;

    updateJoystick(
      e.clientX,
      e.clientY
    );

  }
);


function stopJoy(){

  active=false;

  joyX=0;
  joyY=0;

  stick.style.transform=
    "translate(0,0)";
}


joystick.addEventListener(
  "pointerup",
  stopJoy
);

joystick.addEventListener(
  "pointercancel",
  stopJoy
);

/* =========================================================
   NETWORK
========================================================= */

let channel=null;

async function loadPlayers(){

  if(!roomId)return;

  const result =
    await supabase
    .from("players")
    .select("*")
    .eq(
      "room_id",
      roomId
    );

  if(result.error){

    console.log(result.error);
    return;
  }

  const list=result.data || [];

  list.forEach(
    (p,i)=>{

      if(p.id===me.id)return;

      if(!players.has(p.id)){

        const pos =
          spawnPosition(i+1);

        players.set(
          p.id,
          {
            id:p.id,
            name:p.name,
            x:pos[0],
            y:pos[1],
            targetX:pos[0],
            targetY:pos[1],
            color:COLORS[
              (i+1)%COLORS.length
            ],
            moving:false,
            walk:0,
            direction:0
          }
        );

      }

    }
  );

  document.getElementById(
    "playersHud"
  ).textContent =
    "Players: "+players.size;

}


function setupRealtime(){

  if(!roomId)return;

  channel =
    supabase
    .channel(
      "game-"+roomId
    )

    .on(
      "broadcast",
      {
        event:"move"
      },
      payload=>{

        const p=payload.payload;

        if(!p || p.id===me.id)return;

        let other =
          players.get(p.id);

        if(!other){

          other={
            id:p.id,
            name:p.name || "Crewmate",
            x:p.x,
            y:p.y,
            targetX:p.x,
            targetY:p.y,
            color:p.color || COLORS[1],
            moving:p.moving,
            walk:0,
            direction:p.direction || 0
          };

          players.set(
            p.id,
            other
          );

        }

        other.name =
          p.name || other.name;

        other.targetX=p.x;
        other.targetY=p.y;
        other.moving=!!p.moving;
        other.direction=p.direction || 0;

      }
    )

    .subscribe(
      status=>{

        const dot =
          document.getElementById(
            "connection"
          );

        if(
          status==="SUBSCRIBED"
        ){

          dot.style.background=
            "#48d17b";

          dot.style.boxShadow=
            "0 0 10px #48d17b";

        }

      }
    );

}


async function sendPosition(){

  if(!channel)return;

  await channel.send({

    type:"broadcast",

    event:"move",

    payload:{
      id:me.id,
      name:me.name,
      x:me.x,
      y:me.y,
      moving:me.moving,
      direction:me.direction,
      color:me.color
    }

  });

}

/* =========================================================

const camera={

/* =========================================================
   DRAW HELPERS
========================================================= */

function roundRect(
  x,y,w,h,r
){

  ctx.beginPath();

  ctx.roundRect(
    x,y,w,h,r
  );

  ctx.fill();

}


function drawShadow(
  x,y,w,h
){

  ctx.fillStyle=
    "rgba(0,0,0,.22)";

  ctx.beginPath();

  ctx.ellipse(
    x,
    y,
    w,
    h,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld(){

  ctx.fillStyle="#777b88";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* floor */

  ctx.save();

  ctx.translate(
    -camera.x,
    -camera.y
  );

  ctx.fillStyle="#596170";

  ctx.fillRect(
    0,
    0,
    world.width,
    world.height
  );


  /* rooms */

  rooms.forEach(
    room=>{

      /* outer shadow */

      ctx.fillStyle=
        "rgba(0,0,0,.18)";

      roundRect(
        room.x+8,
        room.y+10,
        room.w,
        room.h,
        18
      );

      /* wall */

      ctx.fillStyle=
        room.wall;

      roundRect(
        room.x,
        room.y,
        room.w,
        room.h,
        18
      );

      /* floor */

      ctx.fillStyle=
        room.floor;

      roundRect(
        room.x+18,
        room.y+18,
        room.w-36,
        room.h-36,
        12
      );

      /* floor tiles */

      ctx.globalAlpha=.12;

      ctx.strokeStyle="#5c6470";
      ctx.lineWidth=2;

      for(
        let x=room.x+25;
        x<room.x+room.w-20;
        x+=70
      ){

        ctx.beginPath();

        ctx.moveTo(
          x,
          room.y+20
        );

        ctx.lineTo(
          x,
          room.y+room.h-20
        );

        ctx.stroke();

      }

      for(
        let y=room.y+25;
        y<room.y+room.h-20;
        y+=70
      ){

        ctx.beginPath();

        ctx.moveTo(
          room.x+20,
          y
        );

        ctx.lineTo(
          room.x+room.w-20,
          y
        );

        ctx.stroke();

      }

      ctx.globalAlpha=1;


      /* room label */

      ctx.fillStyle=
        "rgba(40,45,55,.28)";

      ctx.font=
        "900 22px Arial";

      ctx.textAlign="center";

      ctx.fillText(
        room.name,
        room.x+room.w/2,
        room.y+48
      );

    }
  );


  /* connectors */

  ctx.fillStyle="#9298a5";

  ctx.fillRect(
    820,
    300,
    125,
    100
  );

  ctx.fillRect(
    1585,
    300,
    145,
    100
  );

  ctx.fillRect(
    800,
    1050,
    110,
    100
  );

  ctx.fillRect(
    1555,
    1050,
    145,
    100
  );

  ctx.fillRect(
    820,
    1740,
    130,
    100
  );

  ctx.fillRect(
    1585,
    1740,
    140,
    100
  );


  /* decor */

  decor.forEach(
    d=>drawDecor(d)
  );


  /* walls */

  walls.forEach(
    w=>{

      ctx.fillStyle=
        "#59606d";

      roundRect(
        w.x,
        w.y,
        w.w,
        w.h,
        8
      );

      ctx.fillStyle=
        "rgba(255,255,255,.10)";

      ctx.fillRect(
        w.x+3,
        w.y+3,
        w.w-6,
        Math.min(5,w.h-6)
      );

    }
  );


  ctx.restore();

}


function drawDecor(d){

  const x=d.x;
  const y=d.y;

  if(d.type==="table"){

    drawShadow(
      x,
      y+45,
      d.w*.48,
      d.h*.25
    );

    ctx.fillStyle=d.color;

    roundRect(
      x-d.w/2,
      y-d.h/2,
      d.w,
      d.h,
      22
    );

    ctx.fillStyle=
      "rgba(255,255,255,.12)";

    roundRect(
      x-d.w/2+10,
      y-d.h/2+8,
      d.w-20,
      12,
      6
    );

    return;
  }


  if(
    d.type==="seat"
  ){

    ctx.fillStyle=d.color;

    roundRect(
      x-d.w/2,
      y-d.h/2,
      d.w,
      d.h,
      10
    );

    return;
  }


  if(
    d.type==="bed"
  ){

    drawShadow(
      x,
      y+45,
      d.w*.4,
      12
    );

    ctx.fillStyle=
      "#e6e8ec";

    roundRect(
      x-d.w/2,
      y-d.h/2,
      d.w,
      d.h,
      12
    );

    ctx.fillStyle=
      "#78a4c8";

    roundRect(
      x-d.w/2+8,
      y-d.h/2+8,
      48,
      d.h-16,
      9
    );

    return;
  }


  if(
    d.type==="monitor" ||
    d.type==="screen" ||
    d.type==="console"
  ){

    ctx.fillStyle="#343d4f";

    roundRect(
      x-d.w/2,
      y-d.h/2,
      d.w,
      d.h,
      10
    );

    ctx.fillStyle="#54cfe7";

    roundRect(
      x-d.w/2+9,
      y-d.h/2+9,
      d.w-18,
      d.h-20,
      6
    );

    ctx.fillStyle=
      "rgba(255,255,255,.4)";

    ctx.fillRect(
      x-d.w/2+17,
      y-d.h/2+17,
      d.w*.45,
      5
    );

    return;
  }


  if(
    d.type==="box" ||
    d.type==="crate"
  ){

    ctx.fillStyle=
      "rgba(0,0,0,.15)";

    ctx.fillRect(
      x-d.w/2+7,
      y-d.h/2+8,
      d.w,
      d.h
    );

    ctx.fillStyle=d.color;

    roundRect(
      x-d.w/2,
      y-d.h/2,
      d.w,
      d.h,
      7
    );

    ctx.strokeStyle=
      "rgba(60,35,15,.35)";

    ctx.lineWidth=7;

    ctx.strokeRect(
      x-d.w/2+5,
      y-d.h/2+5,
      d.w-10,
      d.h-10
    );

    return;
  }


  if(
    d.type==="engine"
  ){

    drawShadow(
      x,
      y+110,
      75,
      18
    );

    ctx.fillStyle=
      "#515b6a";

    roundRect(
      x-d.w/2,
      y-d.h/2,
      d.w,
      d.h,
      28
    );

    ctx.fillStyle=
      "#303847";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      65,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle=
      "#49c9dc";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      35,
      0,
      Math.PI*2
    );

    ctx.fill();

    return;
  }


  if(
    d.type==="pipe"
  ){

    ctx.strokeStyle=
      "#6f7885";

    ctx.lineWidth=24;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.moveTo(
      x-d.w/2,
      y
    );

    ctx.lineTo(
      x+d.w/2,
      y
    );

    ctx.stroke();

    return;
  }


  if(
    d.type==="tube"
  ){

    ctx.fillStyle=
      "#303846";

    roundRect(
      x-d.w/2,
      y-d.h/2,
      d.w,
      d.h,
      15
    );

    ctx.fillStyle=d.color;

    roundRect(
      x-d.w/2+9,
      y-d.h/2+15,
      d.w-18,
      d.h-30,
      10
    );

    return;
  }


  if(
    d.type==="reactor"
  ){

    ctx.fillStyle=
      "#555f6d";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      d.w/2,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle=
      "#858d98";

    ctx.lineWidth=15;

    ctx.stroke();

    ctx.fillStyle=
      "#283541";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      72,
      0,
      Math.PI*2
    );

    ctx.fill();

    return;
  }


  if(
    d.type==="reactorCore"
  ){

    ctx.fillStyle=
      d.color;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      d.w/2,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha=.3;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      d.w/1.35,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.globalAlpha=1;

    return;
  }


  if(
    d.type==="antenna"
  ){

    ctx.strokeStyle=
      "#656d7b";

    ctx.lineWidth=18;

    ctx.beginPath();

    ctx.moveTo(
      x,
      y+90
    );

    ctx.lineTo(
      x,
      y-70
    );

    ctx.stroke();

    ctx.fillStyle=
      "#68717f";

    ctx.beginPath();

    ctx.arc(
      x,
      y-75,
      45,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

}


/* =========================================================
   DRAW PLAYER
========================================================= */

function drawPlayer(p){

  const sx =
    p.x-camera.x;

  const sy =
    p.y-camera.y;


  if(
    sx<-100 ||
    sx>W+100 ||
    sy<-120 ||
    sy>H+120
  )return;


  const moving =
    p===me
      ? me.moving
      : p.moving;


  const walk =
    p.walk || 0;


  /* shadow */

  drawShadow(
    sx,
    sy+24,
    28,
    11
  );


  /* feet animation */

  const step =
    moving
      ? Math.sin(walk)*7
      : 0;


  ctx.save();

  ctx.translate(
    sx,
    sy
  );


  /* legs */

  ctx.fillStyle=
    darken(p.color,.72);

  roundRect(
    -18+step,
    15,
    15,
    22,
    7
  );

  roundRect(
    3-step,
    15,
    15,
    22,
    7
  );


  /* backpack */

  ctx.fillStyle=
    darken(p.color,.72);

  roundRect(
    -30,
    -22,
    17,
    48,
    8
  );


  /* body */

  ctx.fillStyle=
    p.color;

  roundRect(
    -27,
    -28,
    54,
    62,
    21
  );


  /* highlight */

  ctx.fillStyle=
    "rgba(255,255,255,.16)";

  roundRect(
    -20,
    -20,
    10,
    38,
    5
  );


  /* visor */

  ctx.fillStyle=
    "#b8efff";

  roundRect(
    -6,
    -20,
    34,
    25,
    12
  );

  ctx.fillStyle=
    "rgba(255,255,255,.48)";

  roundRect(
    0,
    -17,
    13,
    7,
    4
  );


  /* name */

  ctx.font=
    "bold 13px Arial";

  ctx.textAlign=
    "center";

  ctx.fillStyle=
    "rgba(255,255,255,.95)";

  ctx.fillText(
    p.name || "Crewmate",
    0,
    -48
  );


  ctx.restore();

}


function darken(hex,factor){

  const n =
    parseInt(
      hex.replace("#",""),
      16
    );

  let r=(n>>16)&255;
  let g=(n>>8)&255;
  let b=n&255;

  r=Math.floor(r*factor);
  g=Math.floor(g*factor);
  b=Math.floor(b*factor);

  return `rgb(${r},${g},${b})`;
}


/* =========================================================
   MOVEMENT
========================================================= */

const speed=3.4;

function updateMovement(){

  let x=joyX;
  let y=joyY;


  if(keys["w"] || keys["arrowup"])
    y=-1;

  if(keys["s"] || keys["arrowdown"])
    y=1;

  if(keys["a"] || keys["arrowleft"])
    x=-1;

  if(keys["d"] || keys["arrowright"])
    x=1;


  const len=
    Math.hypot(x,y);


  if(len>1){

    x/=len;
    y/=len;

  }


  me.vx=x;
  me.vy=y;

  me.moving =
    Math.abs(x)>.05 ||
    Math.abs(y)>.05;


  if(me.moving){

    me.walk += .25;

    me.direction =
      Math.atan2(
        x,
        y
      );


    const nx =
      me.x+x*speed;

    const ny =
      me.y+y*speed;


    if(!blocked(nx,me.y))
      me.x=nx;

    if(!blocked(me.x,ny))
      me.y=ny;

  }else{

    me.walk=0;

  }


  /* map bounds */

  me.x =
    Math.max(
      90,
      Math.min(
        2390,
        me.x
      )
    );

  me.y =
    Math.max(
      90,
      Math.min(
        2030,
        me.y
      )
    );

}


/* =========================================================
   CAMERA UPDATE
========================================================= */

function updateCamera(){

  /*
    Top-down mobile camera.
    Player stays around lower-middle
    like the classic mobile style.
  */

  const targetX =
    me.x - W/2;

  const targetY =
    me.y - H*.56;


  camera.x +=
    (targetX-camera.x)*.12;

  camera.y +=
    (targetY-camera.y)*.12;


  camera.x =
    Math.max(
      0,
      Math.min(
        world.width-W,
        camera.x
      )
    );


  camera.y =
    Math.max(
      0,
      Math.min(
        world.height-H,
        camera.y
      )
    );

}


/* =========================================================
   GAME LOOP
========================================================= */

let last=performance.now();

function loop(now){

  requestAnimationFrame(loop);

  const dt =
    Math.min(
      32,
      now-last
    );

  last=now;


  updateMovement();

  updateCamera();


  /* interpolate remote players */

  players.forEach(
    p=>{

      if(p===me)return;

      if(
        p.targetX!==undefined
      ){

        p.x +=
          (p.targetX-p.x)*.25;

        p.y +=
          (p.targetY-p.y)*.25;

      }

      if(p.moving){

        p.walk += .2;

      }else{

        p.walk=0;

      }

    }
  );


  drawWorld();


  /* sort players by y */

  const sorted =
    [...players.values()]
    .sort(
      (a,b)=>a.y-b.y
    );


  sorted.forEach(
    drawPlayer
  );


  /* send movement */

  if(
    me.moving &&
    now-me.lastSent>70
  ){

    me.lastSent=now;

    sendPosition();

  }

}


requestAnimationFrame(loop);


/* =========================================================
   START
========================================================= */

await loadMyName();

await loadPlayers();

setupRealtime();


/* initial position */

if(myId){

  const index =
    [...players.keys()]
    .indexOf(myId);

  if(index>=0){

    const pos =
      spawnPosition(index);

    me.x=pos[0];
    me.y=pos[1];

  }

}


/* =========================================================
   PREVENT ZOOM / GESTURES
========================================================= */

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault()
);

document.addEventListener(
  "gesturechange",
  e=>e.preventDefault()
);

document.addEventListener(
  "gestureend",
  e=>e.preventDefault()
);

document.addEventListener(
  "touchmove",
  e=>{

    if(e.target===canvas)
      e.preventDefault();

  },
  {passive:false}
);

</script>
