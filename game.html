<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>SpaceCrew</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  position:fixed;
  background:#101522;
  touch-action:none;
  overscroll-behavior:none;
  font-family:Arial,sans-serif;
}

body{
  width:100vw;
  height:100vh;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  touch-action:none;
}

#hud{
  position:fixed;
  top:12px;
  left:12px;
  z-index:20;
  color:white;
  background:rgba(7,10,18,.75);
  border:1px solid rgba(255,255,255,.15);
  border-radius:12px;
  padding:9px 13px;
  font-size:13px;
  font-weight:800;
  pointer-events:none;
}

#joystick{
  position:fixed;
  z-index:30;
  left:22px;
  bottom:22px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.18);
  touch-action:none;
}

#stick{
  position:absolute;
  width:54px;
  height:54px;
  left:33px;
  top:33px;
  border-radius:50%;
  background:rgba(255,255,255,.32);
  border:2px solid rgba(255,255,255,.55);
  pointer-events:none;
}

#landscape{
  display:none;
  position:fixed;
  z-index:100;
  inset:0;
  background:#090d18;
  color:white;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  padding:30px;
}

@media (orientation:portrait){
  #landscape{
    display:flex;
  }
}
</style>
</head>

<body>

<div id="landscape">
  ↻<br><br>
  Rotate your phone horizontally
</div>

<div id="hud">
  SPACECREW
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<canvas id="game"></canvas>

<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let vw=0;
let vh=0;
let dpr=1;

function resize(){

  vw=window.innerWidth;
  vh=window.innerHeight;

  dpr=Math.min(window.devicePixelRatio||1,2);

  canvas.width=Math.floor(vw*dpr);
  canvas.height=Math.floor(vh*dpr);

  canvas.style.width=vw+"px";
  canvas.style.height=vh+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);

}

resize();

window.addEventListener("resize",resize);


/* =====================================================
   WORLD
===================================================== */

const WORLD_W=3200;
const WORLD_H=1900;


/*
   Room areas.
   These are deliberately irregular,
   so the map feels like a real spaceship
   instead of a few giant rectangles.
*/

const rooms=[

  {x:130,y:170,w:620,h:430},

  {x:1080,y:120,w:780,h:440},

  {x:2180,y:170,w:780,h:430},

  {x:820,y:720,w:1560,h:470},

  {x:130,y:1300,w:650,h:430},

  {x:1050,y:1390,w:700,h:360},

  {x:2080,y:1280,w:880,h:450}

];


/* =====================================================
   COLLISION WALLS
===================================================== */

const walls=[];

function wall(x,y,w,h){
  walls.push({x,y,w,h});
}


/* LEFT TOP */

wall(130,170,620,28);
wall(130,170,28,430);
wall(722,170,28,155);
wall(722,445,28,155);
wall(130,572,215,28);
wall(535,572,215,28);


/* TOP CENTER */

wall(1080,120,780,28);
wall(1080,532,780,28);

wall(1080,120,28,145);
wall(1080,390,28,142);

wall(1832,120,28,130);
wall(1832,410,28,122);


/* RIGHT TOP */

wall(2180,170,780,28);
wall(2180,572,780,28);

wall(2180,170,28,150);
wall(2180,420,28,152);

wall(2932,170,28,180);
wall(2932,390,28,182);


/* CENTRAL AREA */

/* left wall */
wall(820,720,28,145);
wall(820,1035,28,155);

/* right wall */
wall(2352,720,28,170);
wall(2352,1025,28,165);


/* upper central */
wall(850,720,280,28);
wall(1420,720,420,28);
wall(2130,720,222,28);

/* lower central */
wall(850,1162,300,28);
wall(1450,1162,380,28);
wall(2100,1162,252,28);


/* LEFT BOTTOM */

wall(130,1300,650,28);
wall(130,1702,650,28);

wall(130,1300,28,402);
wall(752,1300,28,150);
wall(752,1550,28,152);


/* BOTTOM CENTER */

wall(1050,1390,700,28);
wall(1050,1722,700,28);

wall(1050,1390,28,120);
wall(1050,1640,28,82);

wall(1722,1390,28,145);
wall(1722,1640,28,82);


/* RIGHT BOTTOM */

wall(2080,1280,880,28);
wall(2080,1702,880,28);

wall(2080,1280,28,150);
wall(2080,1550,28,152);

wall(2932,1280,28,170);
wall(2932,1550,28,152);


/* =====================================================
   PLAYER
===================================================== */

const player={
  x:1600,
  y:940,
  radius:25,
  speed:235,
  color:"#5967f2",
  angle:0
};


/* =====================================================
   CAMERA
===================================================== */

const camera={
  x:0,
  y:0
};


/*
  Fixed zoom.

  It NEVER changes during gameplay.
  This is important for iPhone performance.
*/

const CAMERA_ZOOM=1;


/* =====================================================
   JOYSTICK
===================================================== */

const joystick=
document.getElementById("joystick");

const stick=
document.getElementById("stick");

let joyX=0;
let joyY=0;
let joystickActive=false;
let pointerId=null;

function updateJoystick(clientX,clientY){

  const r=joystick.getBoundingClientRect();

  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  let dx=clientX-cx;
  let dy=clientY-cy;

  const max=38;

  const distance=Math.hypot(dx,dy);

  if(distance>max){

    dx=dx/distance*max;
    dy=dy/distance*max;

  }

  joyX=dx/max;
  joyY=dy/max;

  stick.style.transform=
    "translate("+dx+"px,"+dy+"px)";

}

joystick.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    joystickActive=true;
    pointerId=e.pointerId;

    try{
      joystick.setPointerCapture(pointerId);
    }catch{}

    updateJoystick(
      e.clientX,
      e.clientY
    );

  },
  {passive:false}
);

joystick.addEventListener(
  "pointermove",
  e=>{

    if(!joystickActive) return;

    e.preventDefault();

    updateJoystick(
      e.clientX,
      e.clientY
    );

  },
  {passive:false}
);

function stopJoystick(){

  joystickActive=false;

  joyX=0;
  joyY=0;

  stick.style.transform=
    "translate(0px,0px)";

}

joystick.addEventListener(
  "pointerup",
  stopJoystick
);

joystick.addEventListener(
  "pointercancel",
  stopJoystick
);

joystick.addEventListener(
  "lostpointercapture",
  stopJoystick
);


/* =====================================================
   KEYBOARD
===================================================== */

const keys={};

window.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
});

window.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});


/* =====================================================
   COLLISION
===================================================== */

function circleRectCollision(cx,cy,r,rect){

  const closestX=
    Math.max(
      rect.x,
      Math.min(cx,rect.x+rect.w)
    );

  const closestY=
    Math.max(
      rect.y,
      Math.min(cy,rect.y+rect.h)
    );

  const dx=cx-closestX;
  const dy=cy-closestY;

  return dx*dx+dy*dy<r*r;

}


function blocked(x,y){

  for(const w of walls){

    if(circleRectCollision(
      x,
      y,
      player.radius,
      w
    )){
      return true;
    }

  }

  return false;

}


/* =====================================================
   DRAW SPACE FLOOR
===================================================== */

function drawFloor(){

  ctx.fillStyle="#151b2a";

  ctx.fillRect(
    0,
    0,
    WORLD_W,
    WORLD_H
  );


  /*
    subtle floor tiles
  */

  ctx.strokeStyle="rgba(130,145,180,.07)";
  ctx.lineWidth=2;

  const size=80;

  for(let x=0;x<WORLD_W;x+=size){

    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,WORLD_H);
    ctx.stroke();

  }

  for(let y=0;y<WORLD_H;y+=size){

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(WORLD_W,y);
    ctx.stroke();

  }

}


/* =====================================================
   ROOM FLOOR
===================================================== */

function drawRooms(){

  for(const r of rooms){

    ctx.fillStyle="#252d43";

    ctx.fillRect(
      r.x,
      r.y,
      r.w,
      r.h
    );


    ctx.strokeStyle="#3e4967";
    ctx.lineWidth=7;

    ctx.strokeRect(
      r.x,
      r.y,
      r.w,
      r.h
    );

  }


  /*
    central corridor
  */

  ctx.fillStyle="#1c2437";

  ctx.fillRect(
    750,
    865,
    1630,
    170
  );

}


/* =====================================================
   WALL DRAWING
===================================================== */

function drawWalls(){

  for(const w of walls){

    /*
      shadow
    */

    ctx.fillStyle="rgba(0,0,0,.28)";

    ctx.fillRect(
      w.x+5,
      w.y+7,
      w.w,
      w.h
    );


    /*
      wall body
    */

    ctx.fillStyle="#68738e";

    ctx.fillRect(
      w.x,
      w.y,
      w.w,
      w.h
    );


    /*
      inner highlight
    */

    ctx.fillStyle="#7e89a3";

    if(w.w>w.h){

      ctx.fillRect(
        w.x,
        w.y,
        w.w,
        5
      );

    }else{

      ctx.fillRect(
        w.x,
        w.y,
        5,
        w.h
      );

    }


    /*
      dark edge
    */

    ctx.strokeStyle="#424b65";
    ctx.lineWidth=3;

    ctx.strokeRect(
      w.x,
      w.y,
      w.w,
      w.h
    );

  }

}


/* =====================================================
   DOORS / OPENINGS DECORATION
===================================================== */

function drawDoors(){

  const doors=[

    [750,370,75,45],
    [1050,570,90,70],
    [1830,570,90,70],
    [2170,365,75,45],

    [820,870,50,65],
    [2330,870,50,65],

    [760,1430,70,70],
    [1040,1510,70,70],
    [1710,1510,70,70],
    [2070,1430,70,70]

  ];

  for(const d of doors){

    ctx.fillStyle="#151c2e";

    ctx.fillRect(
      d[0],
      d[1],
      d[2],
      d[3]
    );

    ctx.strokeStyle="#596681";
    ctx.lineWidth=3;

    ctx.strokeRect(
      d[0],
      d[1],
      d[2],
      d[3]
    );

  }

}


/* =====================================================
   ROOM OBJECTS
===================================================== */

function drawObject(x,y,w,h,type){

  if(type==="console"){

    ctx.fillStyle="#303a56";

    ctx.fillRect(
      x,
      y,
      w,
      h
    );

    ctx.fillStyle="#72dff4";

    ctx.fillRect(
      x+8,
      y+7,
      w-16,
      h*.35
    );

    ctx.fillStyle="#151c2c";

    ctx.fillRect(
      x+8,
      y+h*.55,
      w-16,
      5
    );

  }


  if(type==="engine"){

    ctx.fillStyle="#3a435e";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      42,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#697793";
    ctx.lineWidth=5;

    ctx.stroke();

    ctx.fillStyle="#68e5ff";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      18,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  if(type==="table"){

    ctx.fillStyle="#343d57";

    ctx.beginPath();

    ctx.ellipse(
      x,
      y,
      w,
      h,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle="#65718d";
    ctx.lineWidth=5;

    ctx.stroke();

  }

}


/* =====================================================
   MAP OBJECTS
===================================================== */

function drawObjects(){

  /* left top */

  drawObject(
    300,310,
    115,60,
    "console"
  );

  drawObject(
    550,470,
    90,55,
    "console"
  );


  /* top */

  drawObject(
    1270,300,
    110,65,
    "console"
  );

  drawObject(
    1630,350,
    42,42,
    "engine"
  );


  /* right */

  drawObject(
    2440,300,
    110,65,
    "console"
  );

  drawObject(
    2760,460,
    42,42,
    "engine"
  );


  /* central */

  drawObject(
    1600,
    950,
    150,
    90,
    "table"
  );


  /* bottom */

  drawObject(
    330,1450,
    110,65,
    "console"
  );

  drawObject(
    1300,1530,
    110,65,
    "console"
  );

  drawObject(
    2380,1450,
    110,65,
    "console"
  );

}


/* =====================================================
   PLAYER
===================================================== */

function drawPlayer(){

  const x=player.x;
  const y=player.y;


  /*
    shadow
  */

  ctx.fillStyle="rgba(0,0,0,.35)";

  ctx.beginPath();

  ctx.ellipse(
    x,
    y+24,
    25,
    9,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    backpack
  */

  ctx.fillStyle="#3c4660";

  ctx.roundRect(
    x-27,
    y-8,
    13,
    30,
    6,
    6
  );

  ctx.fill();


  /*
    body
  */

  ctx.fillStyle=player.color;

  ctx.beginPath();

  ctx.arc(
    x,
    y,
    25,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    bottom body
  */

  ctx.fillStyle=player.color;

  ctx.fillRect(
    x-25,
    y,
    50,
    16
  );


  /*
    visor
  */

  ctx.fillStyle="#a9efff";

  ctx.beginPath();

  ctx.ellipse(
    x+8,
    y-7,
    16,
    11,
    -.15,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    visor dark side
  */

  ctx.fillStyle="#66b9d0";

  ctx.beginPath();

  ctx.ellipse(
    x+12,
    y-5,
    8,
    7,
    -.15,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    visor shine
  */

  ctx.fillStyle="white";

  ctx.beginPath();

  ctx.arc(
    x+10,
    y-10,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    feet
  */

  ctx.fillStyle="#4b5570";

  ctx.beginPath();

  ctx.ellipse(
    x-13,
    y+20,
    11,
    7,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.ellipse(
    x+13,
    y+20,
    11,
    7,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

}


/* =====================================================
   CAMERA UPDATE
===================================================== */

function updateCamera(dt){

  const targetX=
    player.x-vw/2;

  const targetY=
    player.y-vh/2;


  /*
    Smooth follow.
    No zoom.
  */

  const smooth=
    1-Math.pow(.001,dt);


  camera.x +=
    (targetX-camera.x)*smooth;

  camera.y +=
    (targetY-camera.y)*smooth;


  /*
    Clamp camera to map
  */

  const maxX=
    Math.max(0,WORLD_W-vw);

  const maxY=
    Math.max(0,WORLD_H-vh);


  camera.x=
    Math.max(
      0,
      Math.min(
        maxX,
        camera.x
      )
    );

  camera.y=
    Math.max(
      0,
      Math.min(
        maxY,
        camera.y
      )
    );

}


/* =====================================================
   UPDATE PLAYER
===================================================== */

function updatePlayer(dt){

  let x=joyX;
  let y=joyY;


  if(keys["w"]||keys["arrowup"])
    y=-1;

  if(keys["s"]||keys["arrowdown"])
    y=1;

  if(keys["a"]||keys["arrowleft"])
    x=-1;

  if(keys["d"]||keys["arrowright"])
    x=1;


  const len=Math.hypot(x,y);


  if(len>1){

    x/=len;
    y/=len;

  }


  if(len>.05){

    player.angle=
      Math.atan2(y,x);


    const amount=
      player.speed*dt;

    const nx=
      player.x+x*amount;

    const ny=
      player.y+y*amount;


    /*
      Separate X/Y collision.
      This makes sliding around
      corners much smoother.
    */

    if(!blocked(nx,player.y))
      player.x=nx;

    if(!blocked(player.x,ny))
      player.y=ny;

  }


  /*
    world boundary
  */

  player.x=
    Math.max(
      player.radius,
      Math.min(
        WORLD_W-player.radius,
        player.x
      )
    );

  player.y=
    Math.max(
      player.radius,
      Math.min(
        WORLD_H-player.radius,
        player.y
      )
    );

}


/* =====================================================
   RENDER
===================================================== */

function render(){

  ctx.clearRect(
    0,
    0,
    vw,
    vh
  );


  ctx.save();


  /*
    Camera translation.
    Zoom is permanently 1.
  */

  ctx.translate(
    -camera.x,
    -camera.y
  );


  drawFloor();

  drawRooms();

  drawDoors();

  drawObjects();

  drawWalls();

  drawPlayer();


  ctx.restore();

}


/* =====================================================
   GAME LOOP
===================================================== */

let lastTime=
  performance.now();


function loop(now){

  let dt=
    (now-lastTime)/1000;

  lastTime=now;


  /*
    Prevent huge movement
    if the browser freezes briefly.
  */

  dt=Math.min(dt,.033);


  updatePlayer(dt);

  updateCamera(dt);

  render();


  requestAnimationFrame(loop);

}

requestAnimationFrame(loop);


/* =====================================================
   PREVENT IPHONE GESTURES
===================================================== */

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gesturechange",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gestureend",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "touchmove",
  e=>{

    if(e.target===canvas ||
       joystick.contains(e.target)){

      e.preventDefault();

    }

  },
  {passive:false}
);

</script>

</body>
</html>
