<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SpaceCrew</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050814;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  top:14px;
  left:14px;
  z-index:20;
  padding:11px 14px;
  border-radius:14px;
  background:#080d1ddd;
  border:1px solid #ffffff18;
  color:white;
  font-weight:800;
  box-shadow:0 8px 30px #0008;
}

#role{
  margin-top:4px;
  color:#9ca8d8;
  font-size:12px;
}

#taskBox{

  top:14px;
  right:14px;
  z-index:20;
  width:180px;
  padding:12px;
  border-radius:14px;
  background:#080d1ddd;
  border:1px solid #ffffff18;
  color:white;
  font-size:12px;
}

#taskTitle{
  font-weight:900;
  margin-bottom:7px;
}

.task{
  color:#aeb8d8;

}

#joystick{
  position:fixed;
  left:24px;
  bottom:25px;

  height:138px;
  border-radius:50%;
  background:#ffffff0d;
  border:2px solid #ffffff20;
  z-index:30;
}

#stick{
  position:absolute;
  left:39px;
  top:39px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:#6675ff88;
  border:2px solid #aab3ff99;
  box-shadow:0 5px 25px #0008;
}

#action{
  position:fixed;
  right:25px;
  bottom:35px;
  z-index:30;
  width:82px;
  height:82px;
  border:0;
  border-radius:50%;
  background:#5865f2;
  color:white;
  font-size:13px;
  font-weight:900;
  box-shadow:0 8px 30px #0008;
}

#action:active{
  transform:scale(.94);
}

#message{
  position:fixed;
  left:50%;
  bottom:145px;
  transform:translateX(-50%);
  z-index:25;
  padding:10px 16px;
  border-radius:12px;
  background:#080d1ddd;
  color:#dbe0ff;
  font-size:13px;
  opacity:0;
  transition:.2s;
  pointer-events:none;
}

#message.show{
  opacity:1;
}

.nameTag{
  color:white;
  font-size:11px;
  font-weight:900;
  text-shadow:0 2px 4px #000;
}
</style>
</head>

<body>

<div id="hud">
  SPACE<span style="color:#6875ff">CREW</span>
  <div id="role">CREWMATE</div>
</div>

<div id="taskBox">
  <div id="taskTitle">TASKS</div>
  <div class="task">□ Repair Reactor</div>
  <div class="task">□ Calibrate Engine</div>
  <div class="task">□ Scan Console</div>
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="action">USE</button>

<div id="message"></div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {
  createClient
} from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://egackwuidatyuihmdhvo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CC43Qm8KEQHxFByzi0VieQ_lLkSdPsl";

const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   URL
========================= */

const params =
new URLSearchParams(
  location.search
);

const roomId =
params.get("room");

const playerId =
params.get("player");


/* =========================
   SCENE
========================= */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x070b18);


/* =========================
   CAMERA
========================= */

const camera =
new THREE.PerspectiveCamera(
  55,
  innerWidth / innerHeight,
  .1,
  300
);

camera.position.set(
  0,
  25,
  18
);


/* =========================
   RENDERER
========================= */

const renderer =
new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
  renderer.domElement
);


/* =========================
   LIGHT
========================= */

scene.add(
  new THREE.HemisphereLight(
    0xbccaff,
    0x11152b,
    2.4
  )
);

const sun =
new THREE.DirectionalLight(
  0xffffff,
  3
);

sun.position.set(
  10,
  25,
  10
);

sun.castShadow=true;

scene.add(sun);


/* =========================
   FLOOR
========================= */

const floor =
new THREE.Mesh(
  new THREE.PlaneGeometry(
    70,
    70
  ),
  new THREE.MeshStandardMaterial({
    color:0x151b31,
    roughness:.9
  })
);

floor.rotation.x =
-Math.PI/2;

floor.receiveShadow=true;

scene.add(floor);


/* =========================
   FLOOR TILES
========================= */

for(let x=-30;x<=30;x+=2){

  for(let z=-30;z<=30;z+=2){

    const tile =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        1.92,
        1.92
      ),
      new THREE.MeshStandardMaterial({
        color:
          ((x+z)/2)%2===0
          ? 0x192039
          : 0x171d34
      })
    );

    tile.rotation.x =
      -Math.PI/2;

    tile.position.set(
      x,
      .012,
      z
    );

    scene.add(tile);
  }
}


/* =========================
   WALL
========================= */

const walls=[];

function makeWall(
  x,
  z,
  w,
  d
){

  const mesh =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      w,
      3,
      d
    ),
    new THREE.MeshStandardMaterial({
      color:0x343d61,
      roughness:.65
    })
  );

  mesh.position.set(
    x,
    1.5,
    z
  );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);

  walls.push({
    x:x,
    z:z,
    w:w,
    d:d
  });

  return mesh;
}


/* =========================
   OUTER MAP
========================= */

makeWall(
  0,
  -24,
  48,
  1
);

makeWall(
  0,
  24,
  48,
  1
);

makeWall(
  -24,
  0,
  1,
  48
);

makeWall(
  24,
  0,
  1,
  48
);


/* =========================
   ROOMS
========================= */

makeWall(
  -12,
  -10,
  1,
  18
);

makeWall(
  12,
  -10,
  1,
  18
);

makeWall(
  -12,
  10,
  1,
  18
);

makeWall(
  12,
  10,
  1,
  18
);


/* =========================
   CENTRAL HALL
========================= */

makeWall(
  0,
  -5,
  16,
  1
);

makeWall(
  0,
  5,
  16,
  1
);


/* =========================
   REACTOR
========================= */

function createRoom(
  x,
  z,
  color
){

  const room =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      7,
      .25,
      6
    ),
    new THREE.MeshStandardMaterial({
      color:color,
      roughness:.7
    })
  );

  room.position.set(
    x,
    .15,
    z
  );

  room.castShadow=true;

  scene.add(room);

  return room;
}

createRoom(
  -17,
  -17,
  0x26345b
);

createRoom(
  17,
  -17,
  0x26345b
);

createRoom(
  -17,
  17,
  0x26345b
);

createRoom(
  17,
  17,
  0x26345b
);


/* =========================
   TASK CONSOLES
========================= */

const tasks=[];

function taskMachine(
  x,
  z,
  color=0x6675ff
){

  const group =
  new THREE.Group();

  const base =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      1.3,
      .8,
      .7
    ),
    new THREE.MeshStandardMaterial({
      color:0x303954
    })
  );

  base.position.y=.4;

  const screen =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .9,
      .5,
      .08
    ),
    new THREE.MeshStandardMaterial({
      color:color,
      emissive:color,
      emissiveIntensity:.6
    })
  );

  screen.position.set(
    0,
    .75,
    .36
  );

  group.add(base);
  group.add(screen);

  group.position.set(
    x,
    0,
    z
  );

  scene.add(group);

  tasks.push({
    x:x,
    z:z,
    group:group
  });
}

taskMachine(
  -17,
  -17
);

taskMachine(
  17,
  -17,
  0x20d99b
);

taskMachine(
  -17,
  17,
  0xffbf4d
);

taskMachine(
  17,
  17,
  0xff6077
);


/* =========================
   CENTRAL TABLE
========================= */

const table =
new THREE.Mesh(
  new THREE.CylinderGeometry(
    3,
    3,
    .45,
    32
  ),
  new THREE.MeshStandardMaterial({
    color:0x252d49
  })
);

table.position.y=.25;

table.castShadow=true;

scene.add(table);


/* =========================
   PLAYER CREATOR
========================= */

function createPlayer(
  color=0x5865f2
){

  const group =
  new THREE.Group();

  const body =
  new THREE.Mesh(
    new THREE.CapsuleGeometry(
      .65,
      1.05,
      6,
      12
    ),
    new THREE.MeshStandardMaterial({
      color:color,
      roughness:.55
    })
  );

  body.position.y=1;

  body.castShadow=true;

  group.add(body);


  const visor =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .45,
      20,
      14
    ),
    new THREE.MeshStandardMaterial({
      color:0x9cecff,
      metalness:.25,
      roughness:.15
    })
  );

  visor.scale.set(
    1,
    .68,
    .48
  );

  visor.position.set(
    0,
    1.38,
    .48
  );

  visor.castShadow=true;

  group.add(visor);


  const pack =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .7,
      .85,
      .35
    ),
    new THREE.MeshStandardMaterial({
      color:0x343b56
    })
  );

  pack.position.set(
    0,
    .9,
    -.5
  );

  pack.castShadow=true;

  group.add(pack);


  scene.add(group);

  return group;
}


/* =========================
   MY PLAYER
========================= */

const player =
createPlayer(
  0x5865f2
);

player.position.set(
  0,
  0,
  15
);


/* =========================
   OTHER PLAYERS
========================= */

const others =
new Map();


const colors=[
  0xff4f6d,
  0x42d6ff,
  0x64e56f,
  0xffbd45,
  0xb56cff,
  0xff7d45,
  0xffffff,
  0x4d9cff
];


function getOther(
  id,
  name
){

  if(others.has(id))
    return others.get(id);


  const color =
    colors[
      others.size %
      colors.length
    ];


  const mesh =
    createPlayer(color);


  mesh.position.set(
    0,
    0,
    0
  );


  const label =
    document.createElement(
      "div"
    );

  label.className =
    "nameTag";

  label.textContent =
    name || "Crewmate";

  label.style.position=
    "absolute";


  others.set(
    id,
    {
      mesh,
      name
    }
  );


  return others.get(id);
}


/* =========================
   LOAD PLAYERS
========================= */

async function loadPlayers(){

  if(!roomId)
    return;


  const result =
    await supabase
    .from("players")
    .select("*")
    .eq(
      "room_id",
      roomId
    );


  if(result.error){

    console.error(
      result.error
    );

    return;
  }


  for(
    const p of
    result.data || []
  ){

    if(p.id===playerId)
      continue;


    const other =
      getOther(
        p.id,
        p.name
      );


    other.mesh.position.x =
      p.x ?? 0;

    other.mesh.position.z =
      p.y ?? 0;
  }
}


/* =========================
   UPDATE PLAYER
========================= */

let lastSend=0;

async function syncPlayer(){

  if(!playerId)
    return;

  const now =
    performance.now();

  if(
    now-lastSend < 80
  )
    return;

  lastSend=now;


  await supabase
    .from("players")
    .update({
      x:player.position.x,
      y:player.position.z
    })
    .eq(
      "id",
      playerId
    );
}


/* =========================
   REALTIME
========================= */

let channel=null;

function connectRealtime(){

  if(!roomId)
    return;


  channel =
    supabase
    .channel(
      "game-"+roomId+
      "-"+Date.now()
    )

    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"players"
      },
      payload=>{

        if(
          payload.new &&
          payload.new.room_id===
          roomId
        ){

          if(
            payload.new.id===
            playerId
          )
            return;


          getOther(
            payload.new.id,
            payload.new.name
          );

        }

      }
    )

    .on(
      "postgres_changes",
      {
        event:"UPDATE",
        schema:"public",
        table:"players"
      },
      payload=>{

        const p =
          payload.new;

        if(
          !p ||
          p.room_id !== roomId ||
          p.id === playerId
        )
          return;


        const other =
          getOther(
            p.id,
            p.name
          );


        other.mesh.position.x =
          p.x ?? 0;

        other.mesh.position.z =
          p.y ?? 0;

      }
    )

    .on(
      "postgres_changes",
      {
        event:"DELETE",
        schema:"public",
        table:"players"
      },
      payload=>{

        const id =
          payload.old &&
          payload.old.id;


        if(!id)
          return;


        const other =
          others.get(id);


        if(other){

          scene.remove(
            other.mesh
          );

          others.delete(id);

        }

      }
    )

    .subscribe();

}


/* =========================
   JOYSTICK
========================= */

const joystick =
document.getElementById(
  "joystick"
);

const stick =
document.getElementById(
  "stick"
);

let moveX=0;
let moveZ=0;
let active=false;

function joystickMove(
  x,
  y
){

  const rect =
    joystick.getBoundingClientRect();

  const cx =
    rect.left+
    rect.width/2;

  const cy =
    rect.top+
    rect.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=40;

  const len =
    Math.hypot(
      dx,
      dy
    );

  if(len>max){

    dx =
      dx/len*max;

    dy =
      dy/len*max;
  }

  stick.style.transform =
    `translate(${dx}px,${dy}px)`;

  moveX =
    dx/max;

  moveZ =
    dy/max;
}


joystick.addEventListener(
  "pointerdown",
  e=>{

    active=true;

    joystick.setPointerCapture(
      e.pointerId
    );

    joystickMove(
      e.clientX,
      e.clientY
    );

  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(!active)
      return;

    joystickMove(
      e.clientX,
      e.clientY
    );

  }
);


function stopJoystick(){

  active=false;

  moveX=0;
  moveZ=0;

  stick.style.transform=
    "translate(0,0)";
}


joystick.addEventListener(
  "pointerup",
  stopJoystick
);

joystick.addEventListener(
  "pointercancel",
  stopJoystick
);


/* =========================
   KEYBOARD
========================= */

const keys={};

addEventListener(
  "keydown",
  e=>{
    keys[
      e.key.toLowerCase()
    ]=true;
  }
);

addEventListener(
  "keyup",
  e=>{
    keys[
      e.key.toLowerCase()
    ]=false;
  }
);


/* =========================
   COLLISION
========================= */

function blocked(
  x,
  z
){

  const r=.65;

  for(
    const w of walls
  ){

    if(
      x+r > w.x-w.w/2 &&
      x-r < w.x+w.w/2 &&
      z+r > w.z-w.d/2 &&
      z-r < w.z+w.d/2
    ){

      return true;

    }
  }

  return false;
}


/* =========================
   ACTION
========================= */

const message =
document.getElementById(
  "message"
);

function showMessage(
  text
){

  message.textContent=
    text;

  message.classList.add(
    "show"
  );

  setTimeout(
    ()=>{
      message.classList.remove(
        "show"
      );
    },
    1800
  );
}


document
.getElementById("action")
.addEventListener(
  "click",
  ()=>{

    let nearest=null;
    let distance=999;


    for(
      const task of tasks
    ){

      const d =
        Math.hypot(
          player.position.x-
          task.x,

          player.position.z-
          task.z
        );


      if(d<distance){

        distance=d;
        nearest=task;

      }
    }


    if(
      nearest &&
      distance<3
    ){

      showMessage(
        "TASK STARTED ✓"
      );

    }else{

      showMessage(
        "Nothing nearby"
      );

    }

  }
);


/* =========================
   ANIMATION
========================= */

const clock =
new THREE.Clock();


function animate(){

  requestAnimationFrame(
    animate
  );


  let x=moveX;
  let z=moveZ;


  if(keys["w"])
    z=-1;

  if(keys["s"])
    z=1;

  if(keys["a"])
    x=-1;

  if(keys["d"])
    x=1;


  const len =
    Math.hypot(
      x,
      z
    );


  if(len>1){

    x/=len;
    z/=len;

  }


  const speed=.075;


  const nx =
    player.position.x+
    x*speed;

  const nz =
    player.position.z+
    z*speed;


  if(!blocked(nx,player.position.z))
    player.position.x=nx;


  if(!blocked(player.position.x,nz))
    player.position.z=nz;


  if(len>.05){

    player.rotation.y =
      Math.atan2(
        x,
        z
      );

  }


  /* CAMERA */

  const desired =
    new THREE.Vector3(
      player.position.x,
      25,
      player.position.z+18
    );


  camera.position.lerp(
    desired,
    .09
  );


  camera.lookAt(
    player.position.x,
    0,
    player.position.z
  );


  syncPlayer();


  renderer.render(
    scene,
    camera
  );

}


/* =========================
   START
========================= */

async function start(){

  await loadPlayers();

  connectRealtime();

  showMessage(
    "Welcome to SpaceCrew"
  );

  animate();

}

start();


/* =========================
   RESIZE
========================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

</script>

</body>
