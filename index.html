<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SpaceCrew</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 20%,#202957 0%,#080b18 55%);
  color:white;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.screen{
  width:100%;
  max-width:520px;
  min-height:100%;
  padding:24px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.logo{
  text-align:center;
  font-size:46px;
  font-weight:900;
  margin-bottom:8px;
  letter-spacing:-2px;
}

.logo span{
  color:#6672ff;
}

.subtitle{
  text-align:center;
  color:#9da6c7;
  margin-bottom:25px;
}

.card{
  background:rgba(18,23,42,.94);
  border:1px solid #30395d;
  border-radius:24px;
  padding:22px;
  box-shadow:0 20px 70px #0009;
}

input{
  width:100%;
  padding:17px;
  margin-bottom:12px;
  border:1px solid #343e61;
  border-radius:15px;
  background:#080c1b;
  color:white;
  font-size:17px;
  outline:none;
}

input:focus{
  border-color:#6672ff;
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:17px;
  margin-top:10px;
  background:#5865f2;
  color:white;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.5;
}

.secondary{
  background:#252c45;
}

.green{
  background:#20b86b;
}

.hidden{
  display:none!important;
}

.roomTitle{
  text-align:center;
  font-size:14px;
  color:#9da6c7;
  margin-bottom:5px;
}

.inviteLink{
  background:#080c1b;
  border:1px solid #343e61;
  border-radius:13px;
  padding:13px;
  font-size:12px;
  color:#b9c0dd;
  word-break:break-all;
  margin:12px 0;
}

.players{
  margin-top:16px;
  max-height:40vh;
  overflow:auto;
}

.player{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin-bottom:8px;
  border-radius:14px;
  background:#0b1020;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#252c45;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.playerName{
  flex:1;
  font-weight:bold;
}

.host{
  margin-left:7px;
  color:#7f8cff;
  font-size:10px;
}

.count{
  text-align:center;
  color:#9da6c7;
}

.status{
  text-align:center;
  color:#9da6c7;
  min-height:20px;
  margin-top:12px;
}
</style>
</head>

<body>

<!-- HOME -->

<div id="home" class="screen">

  <div class="logo">
    SPACE<span>CREW</span>
  </div>

  <div class="subtitle">
    15 PLAYER ONLINE GAME
  </div>

  <div class="card">

    <input
      id="nameInput"
      maxlength="16"
      autocomplete="off"
      placeholder="Your name"
    >

    <button id="createBtn">
      CREATE GAME
    </button>

    <div
      id="inviteJoin"
      class="hidden"
    >

      <div class="subtitle">
        YOU WERE INVITED
      </div>

      <button
        id="joinBtn"
        class="green"
      >
        JOIN GAME
      </button>

    </div>

    <div
      id="homeStatus"
      class="status"
    ></div>

  </div>
</div>


<!-- LOBBY -->

<div id="lobby" class="screen hidden">

  <div
    class="logo"
    style="font-size:35px"
  >
    LOBBY
  </div>

  <div class="card">

    <div class="roomTitle">
      INVITE YOUR FRIENDS
    </div>

    <div
      id="inviteLink"
      class="inviteLink"
    ></div>

    <button
      id="copyBtn"
      class="green"
    >
      COPY INVITE LINK
    </button>

    <div
      id="playerCount"
      class="count"
      style="margin-top:16px"
    >
      0 / 15 players
    </div>

    <div
      id="players"
      class="players"
    ></div>

    <button
      id="startButton"
    >
      START GAME
    </button>

    <button
      id="leaveButton"
      class="secondary"
    >
      LEAVE GAME
    </button>

    <div
      id="lobbyStatus"
      class="status"
    >
      Waiting for players...
    </div>

  </div>
</div>


<script type="module">

import {
  createClient
}
from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://egackwuidatyuihmdhvo.supabase.co";

const SUPABASE_KEY =
"YOUR_ sb_publishable_CC43Qm8KEQHxFByzi0VieQ_lLkSdPsl";


const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   STATE
========================================= */

let roomId = null;
let playerId = null;
let isHost = false;
let channel = null;


/* =========================================
   ELEMENTS
========================================= */

const home =
document.getElementById("home");

const lobby =
document.getElementById("lobby");

const nameInput =
document.getElementById("nameInput");

const homeStatus =
document.getElementById("homeStatus");

const createBtn =
document.getElementById("createBtn");

const joinBtn =
document.getElementById("joinBtn");

const inviteJoin =
document.getElementById("inviteJoin");

const inviteLink =
document.getElementById("inviteLink");

const copyBtn =
document.getElementById("copyBtn");

const startButton =
document.getElementById("startButton");

const leaveButton =
document.getElementById("leaveButton");

const lobbyStatus =
document.getElementById("lobbyStatus");


/* =========================================
   URL ROOM
========================================= */

const params =
new URLSearchParams(
  window.location.search
);

const inviteRoom =
params.get("room");


/* =========================================
   ROOM ID
========================================= */

function makeRoomId(){

  return crypto.randomUUID();

}


/* =========================================
   SHOW LOBBY
========================================= */

function showLobby(){

  home.classList.add("hidden");

  lobby.classList.remove("hidden");


  const link =
  window.location.origin +
  window.location.pathname +
  "?room=" +
  encodeURIComponent(roomId);


  inviteLink.textContent =
  link;

}


/* =========================================
   CREATE GAME
========================================= */

async function createGame(){

  const name =
  nameInput.value.trim();

  if(!name){

    homeStatus.textContent =
    "Enter your name first.";

    return;
  }


  createBtn.disabled=true;

  homeStatus.textContent =
  "Creating game...";


  const newRoomId =
  makeRoomId();


  const result =
  await supabase
  .from("rooms")
  .insert({

    id:newRoomId,

    code:newRoomId
      .replaceAll("-","")
      .slice(0,6)
      .toUpperCase(),

    max_players:15,

    status:"waiting"

  });


  if(result.error){

    console.error(
      result.error
    );

    homeStatus.textContent =
    "Could not create game.";

    createBtn.disabled=false;

    return;
  }


  roomId =
  newRoomId;

  isHost=true;


  const success =
  await addPlayer(name);


  if(!success){

    createBtn.disabled=false;

    return;
  }


  showLobby();

  startButton.classList.remove(
    "hidden"
  );

  setupRealtime();

}


/* =========================================
   JOIN GAME
========================================= */

async function joinGame(){

  const name =
  nameInput.value.trim();

  if(!name){

    homeStatus.textContent =
    "Enter your name first.";

    return;
  }


  if(!inviteRoom){

    homeStatus.textContent =
    "Invite link is missing.";

    return;
  }


  joinBtn.disabled=true;

  homeStatus.textContent =
  "Joining game...";


  const result =
  await supabase
  .from("rooms")
  .select("*")
  .eq("id",inviteRoom)
  .maybeSingle();


  if(result.error){

    console.error(
      result.error
    );

    homeStatus.textContent =
    "Could not connect.";

    joinBtn.disabled=false;

    return;
  }


  if(!result.data){

    homeStatus.textContent =
    "Game not found.";

    joinBtn.disabled=false;

    return;
  }


  if(result.data.status!=="waiting"){

    homeStatus.textContent =
    "Game already started.";

    joinBtn.disabled=false;

    return;
  }


  const countResult =
  await supabase
  .from("players")
  .select("id",{
    count:"exact",
    head:true
  })
  .eq(
    "room_id",
    inviteRoom
  );


  if(
    countResult.error
  ){

    console.error(
      countResult.error
    );

    homeStatus.textContent =
    "Could not check players.";

    joinBtn.disabled=false;

    return;
  }


  if(
    (countResult.count || 0)
    >=15
  ){

    homeStatus.textContent =
    "Game is full.";

    joinBtn.disabled=false;

    return;
  }


  roomId =
  inviteRoom;

  isHost=false;


  const success =
  await addPlayer(name);


  if(!success){

    joinBtn.disabled=false;

    return;
  }


  showLobby();

  setupRealtime();

}


/* =========================================
   ADD PLAYER
========================================= */

async function addPlayer(name){

  const result =
  await supabase
  .from("players")
  .insert({

    room_id:roomId,

    name:name,

    ready:false,

    is_alive:true,

    is_impostor:false

  })
  .select()
  .single();


  if(result.error){

    console.error(
      "ADD PLAYER:",
      result.error
    );

    alert(
      "Could not join game."
    );

    return false;
  }


  playerId =
  result.data.id;


  return true;

}


/* =========================================
   REALTIME
========================================= */

function setupRealtime(){

  if(channel){

    supabase.removeChannel(
      channel
    );

  }


  channel =
  supabase
  .channel(
    "spacecrew-room-"+roomId
  )

  .on(

    "postgres_changes",

    {
      event:"*",
      schema:"public",
      table:"players"
    },

    payload=>{

      if(
        payload.new &&
        payload.new.room_id === roomId
      ){

        refreshPlayers();

      }

      if(
        payload.old &&
        payload.old.room_id === roomId
      ){

        refreshPlayers();

      }

    }

  )

  .on(

    "postgres_changes",

    {
      event:"UPDATE",
      schema:"public",
      table:"rooms"
    },

    payload=>{

      if(
        payload.new &&
        payload.new.id === roomId
      ){

        if(
          payload.new.status ===
          "playing"
        ){

          goToGame();

        }

      }

    }

  )

  .subscribe();


  refreshPlayers();

}


/* =========================================
   PLAYERS
========================================= */

async function refreshPlayers(){

  if(!roomId) return;


  const result =
  await supabase
  .from("players")
  .select("*")
  .eq(
    "room_id",
    roomId
  )
  .order(
    "created_at",
    {
      ascending:true
    }
  );


  if(result.error){

    console.error(
      result.error
    );

    return;
  }


  const players =
  result.data || [];


  const list =
  document.getElementById(
    "players"
  );


  list.innerHTML="";


  players.forEach(
    (player,index)=>{

      const row =
      document.createElement(
        "div"
      );

      row.className =
      "player";


      const avatar =
      document.createElement(
        "div"
      );

      avatar.className =
      "avatar";

      avatar.textContent =
      "👨‍🚀";


      const name =
      document.createElement(
        "div"
      );

      name.className =
      "playerName";

      name.textContent =
      player.name;


      if(index===0){

        const host =
        document.createElement(
          "span"
        );

        host.className =
        "host";

        host.textContent =
        "HOST";

        name.appendChild(
          host
        );

      }


      row.appendChild(
        avatar
      );

      row.appendChild(
        name
      );

      list.appendChild(
        row
      );

    }
  );


  document
  .getElementById(
    "playerCount"
  )
  .textContent =
  players.length +
  " / 15 players";

}


/* =========================================
   COPY LINK
========================================= */

async function copyInvite(){

  const link =
  inviteLink.textContent;


  try{

    await navigator.clipboard.writeText(
      link
    );

    copyBtn.textContent =
    "COPIED ✓";

    setTimeout(
      ()=>{
        copyBtn.textContent =
        "COPY INVITE LINK";
      },
      1500
    );

  }catch{

    alert(
      link
    );

  }

}


/* =========================================
   START GAME
========================================= */

async function startGame(){

  if(!isHost) return;


  startButton.disabled=true;

  lobbyStatus.textContent =
  "Starting game...";


  const result =
  await supabase
  .from("rooms")
  .update({
    status:"playing"
  })
  .eq(
    "id",
    roomId
  );


  if(result.error){

    console.error(
      result.error
    );

    lobbyStatus.textContent =
    "Could not start game.";

    startButton.disabled=false;

    return;
  }


  goToGame();

}


/* =========================================
   GAME
========================================= */

function goToGame(){

  window.location.href =
  "game.html?room="+
  encodeURIComponent(roomId)+
  "&player="+
  encodeURIComponent(playerId);

}


/* =========================================
   LEAVE
========================================= */

async function leaveGame(){

  if(channel){

    await supabase.removeChannel(
      channel
    );

  }


  if(playerId){

    await supabase
    .from("players")
    .delete()
    .eq(
      "id",
      playerId
    );

  }


  window.location.href =
  window.location.pathname;

}


/* =========================================
   BUTTONS
========================================= */

createBtn.addEventListener(
  "click",
  createGame
);

joinBtn.addEventListener(
  "click",
  joinGame
);

copyBtn.addEventListener(
  "click",
  copyInvite
);

startButton.addEventListener(
  "click",
  startGame
);

leaveButton.addEventListener(
  "click",
  leaveGame
);


/* =========================================
   INVITE MODE
========================================= */

if(inviteRoom){

  inviteJoin.classList.remove(
    "hidden"
  );

}


/* =========================================
   ENTER
========================================= */

nameInput.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Enter"){

      if(inviteRoom){

        joinGame();

      }else{

        createGame();

      }

    }

  }
);

</script>

</body>
</html>
