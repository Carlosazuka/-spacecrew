<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SpaceCrew</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at 50% 15%,#222b5c 0%,#080b18 60%);
  color:white;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.screen{
  width:100%;
  max-width:520px;
  min-height:100%;
  padding:24px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.logo{
  text-align:center;
  font-size:46px;
  font-weight:900;
  letter-spacing:-2px;
  margin-bottom:8px;
}

.logo span{
  color:#6672ff;
}

.subtitle{
  text-align:center;
  color:#9da6c7;
  margin-bottom:25px;
}

.card{
  background:rgba(18,23,42,.96);
  border:1px solid #30395d;
  border-radius:24px;
  padding:22px;
  box-shadow:0 20px 70px #0009;
}

input{
  width:100%;
  padding:17px;
  margin-bottom:12px;
  border:1px solid #343e61;
  border-radius:15px;
  background:#080c1b;
  color:white;
  font-size:17px;
  outline:none;
}

input:focus{
  border-color:#6672ff;
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:17px;
  margin-top:10px;
  background:#5865f2;
  color:white;
  font-size:17px;
  font-weight:800;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.5;
}

.secondary{
  background:#252c45;
}

.green{
  background:#20b86b;
}

.hidden{
  display:none!important;
}

.inviteLink{
  background:#080c1b;
  border:1px solid #343e61;
  border-radius:13px;
  padding:13px;
  font-size:12px;
  color:#b9c0dd;
  word-break:break-all;
  margin:12px 0;
}

.players{
  margin-top:16px;
  max-height:40vh;
  overflow:auto;
}

.player{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin-bottom:8px;
  border-radius:14px;
  background:#0b1020;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#252c45;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.playerName{
  flex:1;
  font-weight:bold;
}

.host{
  margin-left:7px;
  color:#7f8cff;
  font-size:10px;
}

.count{
  text-align:center;
  color:#9da6c7;
}

.status{
  text-align:center;
  color:#9da6c7;
  min-height:20px;
  margin-top:12px;
  line-height:1.4;
}

.error{
  color:#ff7185;
  font-size:13px;
  word-break:break-word;
}
</style>
</head>

<body>

<div id="home" class="screen">

  <div class="logo">
    SPACE<span>CREW</span>
  </div>

  <div class="subtitle">
    15 PLAYER ONLINE GAME
  </div>

  <div class="card">

    <input
      id="nameInput"
      maxlength="16"
      autocomplete="off"
      placeholder="Your name"
    >

    <button id="createBtn">
      CREATE GAME
    </button>

    <div id="inviteJoin" class="hidden">

      <div class="subtitle">
        YOU WERE INVITED
      </div>

      <button id="joinBtn" class="green">
        JOIN GAME
      </button>

    </div>

    <div id="homeStatus" class="status"></div>

  </div>
</div>


<div id="lobby" class="screen hidden">

  <div class="logo" style="font-size:35px">
    LOBBY
  </div>

  <div class="card">

    <div class="subtitle">
      INVITE YOUR FRIENDS
    </div>

    <div id="inviteLink" class="inviteLink"></div>

    <button id="copyBtn" class="green">
      COPY INVITE LINK
    </button>

    <div
      id="playerCount"
      class="count"
      style="margin-top:16px"
    >
      0 / 15 players
    </div>

    <div id="players" class="players"></div>

    <button id="startButton" class="hidden">
      START GAME
    </button>

    <button id="leaveButton" class="secondary">
      LEAVE GAME
    </button>

    <div id="lobbyStatus" class="status">
      Waiting for players...
    </div>

  </div>
</div>


<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://egackwuidatyuihmdhvo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CC43Qm8KEQHxFByzi0VieQ_lLkSdPsl";

const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ================================
   STATE
================================ */

let roomId = null;
let playerId = null;
let isHost = false;
let channel = null;


/* ================================
   ELEMENTS
================================ */

const home =
document.getElementById("home");

const lobby =
document.getElementById("lobby");

const nameInput =
document.getElementById("nameInput");

const homeStatus =
document.getElementById("homeStatus");

const createBtn =
document.getElementById("createBtn");

const inviteJoin =
document.getElementById("inviteJoin");

const joinBtn =
document.getElementById("joinBtn");

const inviteLink =
document.getElementById("inviteLink");

const copyBtn =
document.getElementById("copyBtn");

const startButton =
document.getElementById("startButton");

const leaveButton =
document.getElementById("leaveButton");

const lobbyStatus =
document.getElementById("lobbyStatus");


/* ================================
   URL
================================ */

const urlParams =
new URLSearchParams(
  window.location.search
);

const inviteRoom =
urlParams.get("room");


/* ================================
   STATUS HELPER
================================ */

function showError(element,message){

  element.className =
    "status error";

  element.textContent =
    message;

}


/* ================================
   LOBBY
================================ */

function showLobby(){

  home.classList.add("hidden");

  lobby.classList.remove("hidden");


  const link =
    window.location.origin +
    window.location.pathname +
    "?room=" +
    encodeURIComponent(roomId);


  inviteLink.textContent =
    link;

}


/* ================================
   CREATE GAME
================================ */

async function createGame(){

  const name =
    nameInput.value.trim();


  if(!name){

    homeStatus.textContent =
      "Enter your name first.";

    nameInput.focus();

    return;
  }


  createBtn.disabled = true;

  homeStatus.className =
    "status";

  homeStatus.textContent =
    "Creating game...";


  try{

    /*
      1. Create room.
      Supabase automatically creates UUID.
    */

    const roomResult =
      await supabase
      .from("rooms")
      .insert({
        max_players:15,
        status:"waiting"
      })
      .select()
      .single();


    if(roomResult.error){

      console.error(
        "ROOM CREATE ERROR:",
        roomResult.error
      );

      showError(
        homeStatus,
        "ROOM ERROR: " +
        roomResult.error.message
      );

      createBtn.disabled=false;

      return;
    }


    roomId =
      roomResult.data.id;


    /*
      2. Add host as player.
    */

    const playerResult =
      await supabase
      .from("players")
      .insert({
        room_id:roomId,
        name:name,
        ready:false,
        is_alive:true,
        is_impostor:false
      })
      .select()
      .single();


    if(playerResult.error){

      console.error(
        "PLAYER CREATE ERROR:",
        playerResult.error
      );


      /*
        Remove empty room if player
        creation failed.
      */

      await supabase
      .from("rooms")
      .delete()
      .eq("id",roomId);


      showError(
        homeStatus,
        "PLAYER ERROR: " +
        playerResult.error.message
      );

      createBtn.disabled=false;

      return;
    }


    playerId =
      playerResult.data.id;


    /*
      3. Save host.
    */

    const hostResult =
      await supabase
      .from("rooms")
      .update({
        host_id:playerId
      })
      .eq("id",roomId);


    if(hostResult.error){

      console.error(
        "HOST UPDATE ERROR:",
        hostResult.error
      );

      showError(
        homeStatus,
        "HOST ERROR: " +
        hostResult.error.message
      );

      createBtn.disabled=false;

      return;
    }


    isHost=true;


    showLobby();


    startButton.classList.remove(
      "hidden"
    );


    lobbyStatus.className =
      "status";

    lobbyStatus.textContent =
      "Game created! Send the invite link.";


    setupRealtime();


  }catch(error){

    console.error(error);

    showError(
      homeStatus,
      "ERROR: " +
      error.message
    );

    createBtn.disabled=false;

  }

}


/* ================================
   JOIN GAME
================================ */

async function joinGame(){

  const name =
    nameInput.value.trim();


  if(!name){

    homeStatus.textContent =
      "Enter your name first.";

    nameInput.focus();

    return;
  }


  if(!inviteRoom){

    showError(
      homeStatus,
      "Invalid invite link."
    );

    return;
  }


  joinBtn.disabled=true;

  homeStatus.className =
    "status";

  homeStatus.textContent =
    "Joining game...";


  try{

    const roomResult =
      await supabase
      .from("rooms")
      .select("*")
      .eq("id",inviteRoom)
      .maybeSingle();


    if(roomResult.error){

      console.error(
        roomResult.error
      );

      showError(
        homeStatus,
        "ROOM ERROR: " +
        roomResult.error.message
      );

      joinBtn.disabled=false;

      return;
    }


    const room =
      roomResult.data;


    if(!room){

      showError(
        homeStatus,
        "Game not found."
      );

      joinBtn.disabled=false;

      return;
    }


    if(room.status!=="waiting"){

      showError(
        homeStatus,
        "Game already started."
      );

      joinBtn.disabled=false;

      return;
    }


    const countResult =
      await supabase
      .from("players")
      .select("id",{
        count:"exact",
        head:true
      })
      .eq(
        "room_id",
        inviteRoom
      );


    if(countResult.error){

      console.error(
        countResult.error
      );

      showError(
        homeStatus,
        "COUNT ERROR: " +
        countResult.error.message
      );

      joinBtn.disabled=false;

      return;
    }


    const count =
      countResult.count || 0;


    if(count>=15){

      showError(
        homeStatus,
        "Game is full."
      );

      joinBtn.disabled=false;

      return;
    }


    roomId =
      inviteRoom;

    isHost=false;


    const playerResult =
      await supabase
      .from("players")
      .insert({
        room_id:roomId,
        name:name,
        ready:false,
        is_alive:true,
        is_impostor:false
      })
      .select()
      .single();


    if(playerResult.error){

      console.error(
        playerResult.error
      );

      showError(
        homeStatus,
        "PLAYER ERROR: " +
        playerResult.error.message
      );

      joinBtn.disabled=false;

      return;
    }


    playerId =
      playerResult.data.id;


    showLobby();


    lobbyStatus.textContent =
      "Joined! Waiting for host...";


    setupRealtime();


  }catch(error){

    console.error(error);

    showError(
      homeStatus,
      "ERROR: " +
      error.message
    );

    joinBtn.disabled=false;

  }

}


/* ================================
   REALTIME
================================ */

function setupRealtime(){

  if(channel){

    supabase.removeChannel(
      channel
    );

  }


  channel =
    supabase
    .channel(
      "spacecrew-" +
      roomId +
      "-" +
      Date.now()
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"players"
      },
      payload=>{

        const newRoom =
          payload.new &&
          payload.new.room_id;

        const oldRoom =
          payload.old &&
          payload.old.room_id;


        if(
          newRoom===roomId ||
          oldRoom===roomId
        ){

          refreshPlayers();

        }

      }
    )

    .on(
      "postgres_changes",
      {
        event:"UPDATE",
        schema:"public",
        table:"rooms"
      },
      payload=>{

        if(
          payload.new &&
          payload.new.id===roomId
        ){

          if(
            payload.new.status===
            "playing"
          ){

            goToGame();

          }

        }

      }
    )

    .subscribe(
      status=>{

        console.log(
          "Realtime:",
          status
        );

      }
    );


  refreshPlayers();

}


/* ================================
   PLAYERS
================================ */

async function refreshPlayers(){

  if(!roomId) return;


  const result =
    await supabase
    .from("players")
    .select("*")
    .eq(
      "room_id",
      roomId
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(result.error){

    console.error(
      result.error
    );

    return;
  }


  const players =
    result.data || [];


  const list =
    document.getElementById(
      "players"
    );


  list.innerHTML="";


  players.forEach(
    (player,index)=>{

      const row =
        document.createElement(
          "div"
        );

      row.className="player";


      const avatar =
        document.createElement(
          "div"
        );

      avatar.className="avatar";

      avatar.textContent="👨‍🚀";


      const playerName =
        document.createElement(
          "div"
        );

      playerName.className=
        "playerName";

      playerName.textContent=
        player.name;


      if(
        player.id ===
        playerId ||
        index===0
      ){

        if(index===0){

          const host =
            document.createElement(
              "span"
            );

          host.className="host";

          host.textContent="HOST";

          playerName.appendChild(
            host
          );

        }

      }


      row.appendChild(
        avatar
      );

      row.appendChild(
        playerName
      );

      list.appendChild(
        row
      );

    }
  );


  document
  .getElementById(
    "playerCount"
  )
  .textContent =
    players.length +
    " / 15 players";

}


/* ================================
   COPY LINK
================================ */

async function copyLink(){

  try{

    await navigator.clipboard.writeText(
      inviteLink.textContent
    );


    copyBtn.textContent =
      "COPIED ✓";


    setTimeout(
      ()=>{
        copyBtn.textContent =
          "COPY INVITE LINK";
      },
      1500
    );


  }catch{

    alert(
      inviteLink.textContent
    );

  }

}


/* ================================
   START GAME
================================ */

async function startGame(){

  if(!isHost) return;


  startButton.disabled=true;

  lobbyStatus.className =
    "status";

  lobbyStatus.textContent =
    "Starting game...";


  const result =
    await supabase
    .from("rooms")
    .update({
      status:"playing"
    })
    .eq(
      "id",
      roomId
    );


  if(result.error){

    console.error(
      result.error
    );

    showError(
      lobbyStatus,
      "START ERROR: " +
      result.error.message
    );

    startButton.disabled=false;

    return;
  }


  goToGame();

}


/* ================================
   GAME
================================ */

function goToGame(){

  window.location.href =
    "game.html?room=" +
    encodeURIComponent(roomId) +
    "&player=" +
    encodeURIComponent(playerId);

}


/* ================================
   LEAVE
================================ */

async function leaveGame(){

  if(playerId){

    await supabase
    .from("players")
    .delete()
    .eq(
      "id",
      playerId
    );

  }


  if(channel){

    await supabase.removeChannel(
      channel
    );

  }


  window.location.href =
    window.location.pathname;

}


/* ================================
   BUTTONS
================================ */

createBtn.addEventListener(
  "click",
  createGame
);

joinBtn.addEventListener(
  "click",
  joinGame
);

copyBtn.addEventListener(
  "click",
  copyLink
);

startButton.addEventListener(
  "click",
  startGame
);

leaveButton.addEventListener(
  "click",
  leaveGame
);


/* ================================
   INVITE MODE
================================ */

if(inviteRoom){

  inviteJoin.classList.remove(
    "hidden"
  );

}


/* ================================
   ENTER
================================ */

nameInput.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Enter"){

      if(inviteRoom){

        joinGame();

      }else{

        createGame();

      }

    }

  }
);

</script>

</body>
</html>
