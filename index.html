<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>SpaceCrew</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 10%,#28346f,#080b18 65%);
  color:white;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.screen{
  width:100%;
  max-width:520px;
  min-height:100%;
  padding:22px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.logo{
  text-align:center;
  font-size:48px;
  font-weight:900;
  letter-spacing:-2px;
  margin-bottom:8px;
}

.logo span{
  color:#6875ff;
}

.subtitle{
  text-align:center;
  color:#9da6c7;
  margin-bottom:24px;
}

.card{
  background:rgba(17,22,42,.97);
  border:1px solid #30395d;
  border-radius:24px;
  padding:22px;
  box-shadow:0 20px 70px #000b;
}

input{
  width:100%;
  padding:17px;
  margin-bottom:12px;
  border:1px solid #343e61;
  border-radius:15px;
  background:#080c1b;
  color:white;
  font-size:17px;
  outline:none;
}

input:focus{
  border-color:#6875ff;
}

button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:17px;
  margin-top:10px;
  background:#5865f2;
  color:white;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.5;
}

.green{
  background:#20b86b;
}

.secondary{
  background:#252c45;
}

.hidden{
  display:none!important;
}

.invite{
  background:#080c1b;
  border:1px solid #343e61;
  border-radius:13px;
  padding:13px;
  font-size:12px;
  color:#c0c7e2;
  word-break:break-all;
  margin:12px 0;
}

.players{
  margin-top:16px;
  max-height:40vh;
  overflow:auto;
}

.player{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin-bottom:8px;
  border-radius:14px;
  background:#0b1020;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#252c45;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:21px;
}

.playerName{
  flex:1;
  font-weight:bold;
}

.host{
  color:#7f8cff;
  font-size:10px;
  margin-left:7px;
}

.count{
  text-align:center;
  color:#9da6c7;
  margin-top:15px;
}

.status{
  text-align:center;
  color:#9da6c7;
  min-height:22px;
  margin-top:12px;
  line-height:1.4;
}

.error{
  color:#ff7185;
}
</style>
</head>

<body>

<!-- HOME -->

<div id="home" class="screen">

  <div class="logo">
    SPACE<span>CREW</span>
  </div>

  <div class="subtitle">
    ONLINE • UP TO 15 PLAYERS
  </div>

  <div class="card">

    <input
      id="name"
      maxlength="16"
      autocomplete="off"
      placeholder="Enter your name"
    >

    <button id="create">
      CREATE GAME
    </button>

    <div id="joinArea" class="hidden">

      <div class="subtitle" style="margin-top:20px">
        YOU WERE INVITED
      </div>

      <button id="join" class="green">
        JOIN GAME
      </button>

    </div>

    <div id="homeStatus" class="status"></div>

  </div>

</div>


<!-- LOBBY -->

<div id="lobby" class="screen hidden">

  <div class="logo" style="font-size:36px">
    LOBBY
  </div>

  <div class="card">

    <div class="subtitle">
      INVITE YOUR FRIENDS
    </div>

    <div id="invite" class="invite"></div>

    <button id="copy" class="green">
      COPY INVITE LINK
    </button>

    <div id="count" class="count">
      0 / 15 players
    </div>

    <div id="players" class="players"></div>

    <button id="start">
      START GAME
    </button>

    <button id="leave" class="secondary">
      LEAVE GAME
    </button>

    <div id="lobbyStatus" class="status">
      Waiting for players...
    </div>

  </div>

</div>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
"https://egackwuidatyuihmdhvo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CC43Qm8KEQHxFByzi0VieQ_lLkSdPsl";

const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =================================
   STATE
================================= */

let roomId = null;
let playerId = null;
let host = false;
let channel = null;


/* =================================
   ELEMENTS
================================= */

const home =
document.getElementById("home");

const lobby =
document.getElementById("lobby");

const nameInput =
document.getElementById("name");

const createBtn =
document.getElementById("create");

const joinBtn =
document.getElementById("join");

const joinArea =
document.getElementById("joinArea");

const homeStatus =
document.getElementById("homeStatus");

const invite =
document.getElementById("invite");

const copyBtn =
document.getElementById("copy");

const count =
document.getElementById("count");

const playersBox =
document.getElementById("players");

const startBtn =
document.getElementById("start");

const leaveBtn =
document.getElementById("leave");

const lobbyStatus =
document.getElementById("lobbyStatus");


/* =================================
   INVITE ROOM
================================= */

const params =
new URLSearchParams(
  window.location.search
);

const invitedRoom =
params.get("room");


/* =================================
   MESSAGE
================================= */

function showMessage(text,error=false){

  homeStatus.textContent =
    text;

  homeStatus.className =
    error
    ? "status error"
    : "status";
}


/* =================================
   SHOW LOBBY
================================= */

function openLobby(){

  home.classList.add("hidden");

  lobby.classList.remove("hidden");


  const link =
    window.location.origin +
    window.location.pathname +
    "?room=" +
    encodeURIComponent(roomId);


  invite.textContent =
    link;

}


/* =================================
   CREATE GAME
================================= */

async function createGame(){

  const name =
    nameInput.value.trim();


  if(!name){

    showMessage(
      "Enter your name first.",
      true
    );

    nameInput.focus();

    return;
  }


  createBtn.disabled=true;

  showMessage(
    "Creating game..."
  );


  try{

    /*
      IMPORTANT:
      Your rooms table still requires
      the "code" column.
      
      So we create an internal
      random code here.
      
      Players never need to type it.
    */

    const code =
      Math.random()
      .toString(36)
      .substring(2,8)
      .toUpperCase();


    /* CREATE ROOM */

    const roomResult =
      await supabase
      .from("rooms")
      .insert({

        code:code,

        max_players:15,

        status:"waiting"

      })
      .select()
      .single();


    if(roomResult.error){

      console.error(
        "ROOM ERROR:",
        roomResult.error
      );

      showMessage(
        "ROOM ERROR: " +
        roomResult.error.message,
        true
      );

      createBtn.disabled=false;

      return;
    }


    roomId =
      roomResult.data.id;


    /* CREATE HOST PLAYER */

    const playerResult =
      await supabase
      .from("players")
      .insert({

        room_id:roomId,

        name:name,

        ready:false,

        is_alive:true,

        is_impostor:false

      })
      .select()
      .single();


    if(playerResult.error){

      console.error(
        "PLAYER ERROR:",
        playerResult.error
      );


      await supabase
      .from("rooms")
      .delete()
      .eq("id",roomId);


      showMessage(
        "PLAYER ERROR: " +
        playerResult.error.message,
        true
      );

      createBtn.disabled=false;

      return;
    }


    playerId =
      playerResult.data.id;

    host=true;


    /* SAVE HOST */

    const hostResult =
      await supabase
      .from("rooms")
      .update({

        host_id:playerId

      })
      .eq(
        "id",
        roomId
      );


    if(hostResult.error){

      console.error(
        "HOST ERROR:",
        hostResult.error
      );

      showMessage(
        "HOST ERROR: " +
        hostResult.error.message,
        true
      );

      createBtn.disabled=false;

      return;
    }


    /* OPEN LOBBY */

    openLobby();


    startBtn.classList.remove(
      "hidden"
    );


    lobbyStatus.textContent =
      "Game created! Send the invite link.";


    connect();


  }catch(error){

    console.error(error);

    showMessage(
      "ERROR: " +
      error.message,
      true
    );

    createBtn.disabled=false;

  }

}


/* =================================
   JOIN GAME
================================= */

async function joinGame(){

  const name =
    nameInput.value.trim();


  if(!name){

    showMessage(
      "Enter your name first.",
      true
    );

    nameInput.focus();

    return;
  }


  if(!invitedRoom){

    showMessage(
      "Invalid invite link.",
      true
    );

    return;
  }


  joinBtn.disabled=true;

  showMessage(
    "Joining game..."
  );


  try{

    /* FIND ROOM */

    const roomResult =
      await supabase
      .from("rooms")
      .select("*")
      .eq(
        "id",
        invitedRoom
      )
      .maybeSingle();


    if(roomResult.error){

      console.error(
        "ROOM ERROR:",
        roomResult.error
      );

      showMessage(
        "ROOM ERROR: " +
        roomResult.error.message,
        true
      );

      joinBtn.disabled=false;

      return;
    }


    if(!roomResult.data){

      showMessage(
        "Game not found.",
        true
      );

      joinBtn.disabled=false;

      return;
    }


    if(
      roomResult.data.status !==
      "waiting"
    ){

      showMessage(
        "Game already started.",
        true
      );

      joinBtn.disabled=false;

      return;
    }


    /* COUNT PLAYERS */

    const countResult =
      await supabase
      .from("players")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      )
      .eq(
        "room_id",
        invitedRoom
      );


    if(countResult.error){

      console.error(
        "COUNT ERROR:",
        countResult.error
      );

      showMessage(
        "COUNT ERROR: " +
        countResult.error.message,
        true
      );

      joinBtn.disabled=false;

      return;
    }


    const total =
      countResult.count || 0;


    if(total >= 15){

      showMessage(
        "Game is full.",
        true
      );

      joinBtn.disabled=false;

      return;
    }


    /* ADD PLAYER */

    const playerResult =
      await supabase
      .from("players")
      .insert({

        room_id:invitedRoom,

        name:name,

        ready:false,

        is_alive:true,

        is_impostor:false

      })
      .select()
      .single();


    if(playerResult.error){

      console.error(
        "PLAYER ERROR:",
        playerResult.error
      );

      showMessage(
        "PLAYER ERROR: " +
        playerResult.error.message,
        true
      );

      joinBtn.disabled=false;

      return;
    }


    roomId =
      invitedRoom;

    playerId =
      playerResult.data.id;

    host=false;


    openLobby();


    lobbyStatus.textContent =
      "Joined! Waiting for host.";


    connect();


  }catch(error){

    console.error(error);

    showMessage(
      "ERROR: " +
      error.message,
      true
    );

    joinBtn.disabled=false;

  }

}


/* =================================
   REALTIME
================================= */

function connect(){

  if(channel){

    supabase.removeChannel(
      channel
    );

  }


  channel =
    supabase
    .channel(
      "spacecrew-" +
      roomId +
      "-" +
      Date.now()
    )

    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"players"
      },
      payload=>{

        const newRoom =
          payload.new &&
          payload.new.room_id;

        const oldRoom =
          payload.old &&
          payload.old.room_id;


        if(
          newRoom === roomId ||
          oldRoom === roomId
        ){

          refreshPlayers();

        }

      }
    )

    .on(
      "postgres_changes",
      {
        event:"UPDATE",
        schema:"public",
        table:"rooms"
      },
      payload=>{

        if(
          payload.new &&
          payload.new.id === roomId
        ){

          if(
            payload.new.status ===
            "playing"
          ){

            goToGame();

          }

        }

      }
    )

    .subscribe();


  refreshPlayers();

}


/* =================================
   REFRESH PLAYERS
================================= */

async function refreshPlayers(){

  if(!roomId) return;


  const result =
    await supabase
    .from("players")
    .select("*")
    .eq(
      "room_id",
      roomId
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(result.error){

    console.error(
      result.error
    );

    return;
  }


  const list =
    result.data || [];


  playersBox.innerHTML="";


  list.forEach(
    (player,index)=>{

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "player";


      const avatar =
        document.createElement(
          "div"
        );

      avatar.className =
        "avatar";

      avatar.textContent =
        "👨‍🚀";


      const playerName =
        document.createElement(
          "div"
        );

      playerName.className =
        "playerName";

      playerName.textContent =
        player.name;


      if(index===0){

        const badge =
          document.createElement(
            "span"
          );

        badge.className =
          "host";

        badge.textContent =
          "HOST";

        playerName.appendChild(
          badge
        );

      }


      row.appendChild(
        avatar
      );

      row.appendChild(
        playerName
      );

      playersBox.appendChild(
        row
      );

    }
  );


  count.textContent =
    list.length +
    " / 15 players";

}


/* =================================
   START GAME
================================= */

async function startGame(){

  if(!host) return;


  startBtn.disabled=true;

  lobbyStatus.textContent =
    "Starting game...";


  const result =
    await supabase
    .from("rooms")
    .update({

      status:"playing"

    })
    .eq(
      "id",
      roomId
    );


  if(result.error){

    console.error(
      result.error
    );

    lobbyStatus.textContent =
      "START ERROR: " +
      result.error.message;

    startBtn.disabled=false;

    return;
  }


  goToGame();

}


/* =================================
   GO TO GAME
================================= */

function goToGame(){

  window.location.href =
    "game.html?room=" +
    encodeURIComponent(roomId) +
    "&player=" +
    encodeURIComponent(playerId);

}


/* =================================
   COPY INVITE
================================= */

async function copyLink(){

  const link =
    invite.textContent;


  try{

    await navigator.clipboard.writeText(
      link
    );


    copyBtn.textContent =
      "COPIED ✓";


    setTimeout(
      ()=>{
        copyBtn.textContent =
          "COPY INVITE LINK";
      },
      1500
    );


  }catch{

    alert(link);

  }

}


/* =================================
   LEAVE
================================= */

async function leaveGame(){

  if(playerId){

    await supabase
    .from("players")
    .delete()
    .eq(
      "id",
      playerId
    );

  }


  if(channel){

    await supabase.removeChannel(
      channel
    );

  }


  window.location.href =
    window.location.pathname;

}


/* =================================
   BUTTONS
================================= */

createBtn.addEventListener(
  "click",
  createGame
);

joinBtn.addEventListener(
  "click",
  joinGame
);

copyBtn.addEventListener(
  "click",
  copyLink
);

startBtn.addEventListener(
  "click",
  startGame
);

leaveBtn.addEventListener(
  "click",
  leaveGame
);


/* =================================
   INVITE MODE
================================= */

if(invitedRoom){

  joinArea.classList.remove(
    "hidden"
  );

}


/* =================================
   ENTER
================================= */

nameInput.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Enter"){

      if(invitedRoom){

        joinGame();

      }else{

        createGame();

      }

    }

  }
);

</script>

</body>
</html>
